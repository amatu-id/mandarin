    { id: 'h-g3', type: 'grammar', title: 'Kalimat Syarat: 如果, 只要, 只有', zh: '条件句 · tiáojiàn jù',
      explain: '<p>Tiga pola syarat yang sering tertukar:</p><table class="gt"><tr><th>Pola</th><th>Makna</th><th>Contoh</th></tr><tr><td>如果 / 要是 A (的话)，就 B</td><td>jika A, maka B</td><td>如果下雨，我们就不去了。</td></tr><tr><td>只要 A，就 B</td><td>asalkan A, pasti B (A <b>cukup</b>)</td><td>只要努力，就能学好。</td></tr><tr><td>只有 A，才 B</td><td>hanya jika A, barulah B (A <b>wajib</b>)</td><td>只有多说，才能说得流利。</td></tr></table><p>Pasangan katanya tetap: <b>只要 … 就</b>, <b>只有 … 才</b>. Jangan dibalik: “只要 … 才” salah.</p><p>Dalam percakapan, <b>要是 … 的话</b> terdengar lebih santai daripada 如果.</p><p class="tip">Kalimat motivasi: 只要每天练习十五分钟，你就能说汉语！</p>',
      pattern: ['如果 / 要是 + A (的话)，Subjek + 就 + B', '只要 + A，Subjek + 就 + B', '只有 + A，Subjek + 才 + B'],
      examples: ['如果明天下雨，我们就不去了。|Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù le.|Jika besok hujan, kita tidak jadi pergi.', '要是你有时间的话，就来我家玩儿吧。|Yàoshi nǐ yǒu shíjiān de huà, jiù lái wǒ jiā wánr ba.|Kalau kamu ada waktu, mampirlah ke rumah saya.', '只要你努力，就一定能学好汉语。|Zhǐyào nǐ nǔlì, jiù yídìng néng xué hǎo Hànyǔ.|Asalkan kamu berusaha, pasti bisa menguasai bahasa Mandarin.', '只要有手机，就可以付钱。|Zhǐyào yǒu shǒujī, jiù kěyǐ fù qián.|Asal punya ponsel, sudah bisa membayar.', '只有多说，才能说得流利。|Zhǐyǒu duō shuō, cái néng shuō de liúlì.|Hanya dengan banyak berbicara, barulah bisa lancar.', '只有经理同意，我们才能签合同。|Zhǐyǒu jīnglǐ tóngyì, wǒmen cái néng qiān hétong.|Hanya jika manajer setuju, barulah kita bisa menandatangani kontrak.', '如果有问题，就给我打电话。|Rúguǒ yǒu wèntí, jiù gěi wǒ dǎ diànhuà.|Jika ada masalah, telepon saya.', '只要价格合适，我们就买。|Zhǐyào jiàgé héshì, wǒmen jiù mǎi.|Asalkan harganya cocok, kami beli.'],
      quiz: ['___明天下雨，我们就不去了。|___ míngtiān xià yǔ, wǒmen jiù bú qù le.|如果:Rúguǒ|虽然:Suīrán|不但:Búdàn|Jika besok hujan, kita tidak jadi pergi.', '只要你努力，___一定能学好汉语。|Zhǐyào nǐ nǔlì, ___ yídìng néng xué hǎo Hànyǔ.|就:jiù|才:cái|都:dōu|Asalkan berusaha, pasti bisa menguasai Mandarin.', '只有多说，___能说得流利。|Zhǐyǒu duō shuō, ___ néng shuō de liúlì.|才:cái|就:jiù|都:dōu|Hanya dengan banyak berbicara, barulah bisa lancar.', '___经理同意，我们才能签合同。|___ jīnglǐ tóngyì, wǒmen cái néng qiān hétong.|只有:Zhǐyǒu|只要:Zhǐyào|虽然:Suīrán|Hanya jika manajer setuju, barulah kita bisa tanda tangan kontrak.', '___有手机，就可以付钱。|___ yǒu shǒujī, jiù kěyǐ fù qián.|只要:Zhǐyào|只有:Zhǐyǒu|除了:Chúle|Asal punya ponsel, sudah bisa bayar.', '要是你有时间的___，就来我家玩儿吧。|Yàoshi nǐ yǒu shíjiān de ___, jiù lái wǒ jiā wánr ba.|话:huà|事:shì|人:rén|Kalau kamu ada waktu, mampirlah ke rumah saya.', '如果有问题，___给我打电话。|Rúguǒ yǒu wèntí, ___ gěi wǒ dǎ diànhuà.|就:jiù|才:cái|而且:érqiě|Jika ada masalah, telepon saya.', '只要价格合适，我们___买。|Zhǐyào jiàgé héshì, wǒmen ___ mǎi.|就:jiù|才:cái|连:lián|Asalkan harganya cocok, kami beli.']
    },
    { id: 'h-g4', type: 'grammar', title: 'Penekanan dengan 是…的', zh: '是…的 · shì…de',
      explain: '<p><b>是 … 的</b> dipakai untuk menekankan <b>kapan, di mana, bagaimana, atau oleh siapa</b> suatu kejadian yang <b>sudah terjadi</b>. Kejadiannya sudah diketahui; yang ditanyakan atau ditekankan adalah detailnya.</p><ul><li>你<b>是</b>什么时候来<b>的</b>？ Kapan kamu datang?</li><li>我<b>是</b>坐地铁来<b>的</b>。 Saya datang naik MRT.</li></ul><p>Dalam kalimat positif, 是 boleh dihilangkan (我坐地铁来的), tetapi dalam kalimat negatif harus ada: <b>不是 … 的</b>. Objek boleh diletakkan setelah 的: 我是在北京学<b>的</b>汉语.</p><p class="tip">Saat berkenalan, orang Tiongkok sering bertanya 你是什么时候来中国的？ atau 你的汉语是在哪儿学的？</p>',
      pattern: ['Subjek + (是) + waktu / tempat / cara + kata kerja + 的', 'Subjek + 不是 + … + kata kerja + 的', 'Subjek + 是 + … + kata kerja + 的 + objek'],
      examples: ['你是什么时候来的？|Nǐ shì shénme shíhou lái de?|Kapan kamu datang?', '我是昨天到的。|Wǒ shì zuótiān dào de.|Saya tiba kemarin.', '你是怎么来的？——我是坐地铁来的。|Nǐ shì zěnme lái de? — Wǒ shì zuò dìtiě lái de.|Kamu datang naik apa? — Saya naik MRT.', '这件衣服是在哪儿买的？|Zhè jiàn yīfu shì zài nǎr mǎi de?|Baju ini dibeli di mana?', '我不是一个人来的，是跟朋友一起来的。|Wǒ bú shì yí ge rén lái de, shì gēn péngyou yìqǐ lái de.|Saya tidak datang sendiri, saya datang bersama teman.', '这个菜是我妈妈做的。|Zhège cài shì wǒ māma zuò de.|Masakan ini buatan ibu saya.', '我是在北京学的汉语。|Wǒ shì zài Běijīng xué de Hànyǔ.|Saya belajar bahasa Mandarin di Beijing.', '他们是二〇一五年认识的。|Tāmen shì èr líng yī wǔ nián rènshi de.|Mereka berkenalan pada tahun 2015.'],
      quiz: ['你是什么时候来___？|Nǐ shì shénme shíhou lái ___?|的:de|了:le|过:guo|Kapan kamu datang?', '我是坐地铁来___。|Wǒ shì zuò dìtiě lái ___.|的:de|了:le|吗:ma|Saya datang naik MRT.', '这件衣服___在哪儿买的？|Zhè jiàn yīfu ___ zài nǎr mǎi de?|是:shì|有:yǒu|很:hěn|Baju ini dibeli di mana?', '我___一个人来的，是跟朋友一起来的。|Wǒ ___ yí ge rén lái de, shì gēn péngyou yìqǐ lái de.|不是:bú shì|没:méi|没有:méiyǒu|Saya tidak datang sendiri, saya datang bersama teman.', '这个菜是我妈妈___的。|Zhège cài shì wǒ māma ___ de.|做:zuò|是:shì|在:zài|Masakan ini buatan ibu saya.', '我是___北京学的汉语。|Wǒ shì ___ Běijīng xué de Hànyǔ.|在:zài|把:bǎ|被:bèi|Saya belajar Mandarin di Beijing.', '你是___来的？——坐出租车来的。|Nǐ shì ___ lái de? — Zuò chūzūchē lái de.|怎么:zěnme|什么:shénme|哪儿:nǎr|Kamu datang dengan apa? — Naik taksi.', '他们是二〇一五年认识___。|Tāmen shì èr líng yī wǔ nián rènshi ___.|的:de|了:le|过:guo|Mereka berkenalan pada tahun 2015.']
    },
    { id: 'h-t3', type: 'topic', cat: 'work', title: 'Menyampaikan Pendapat dalam Rapat', zh: '会议发言 · huìyì fāyán',
      phrases: ['我先说说我的看法。|Wǒ xiān shuōshuo wǒ de kànfǎ.|Saya sampaikan pandangan saya dulu.', '我认为这个方案可行。|Wǒ rènwéi zhège fāng\'àn kěxíng.|Menurut saya rencana ini layak.', '我同意王经理的意见。|Wǒ tóngyì Wáng jīnglǐ de yìjiàn.|Saya setuju dengan pendapat Manajer Wang.', '我有不同的看法。|Wǒ yǒu bù tóng de kànfǎ.|Saya punya pandangan berbeda.', '这样做的好处是成本低。|Zhèyàng zuò de hǎochu shì chéngběn dī.|Keuntungan cara ini adalah biayanya rendah.', '但是有一个问题我们要考虑。|Dànshì yǒu yí ge wèntí wǒmen yào kǎolǜ.|Tetapi ada satu masalah yang harus kita pertimbangkan.', '我建议先做一个小规模的试验。|Wǒ jiànyì xiān zuò yí ge xiǎo guīmó de shìyàn.|Saya sarankan uji coba skala kecil dulu.', '能不能具体说一下？|Néng bu néng jùtǐ shuō yíxià?|Bisa dijelaskan lebih spesifik?', '我补充一点。|Wǒ bǔchōng yì diǎn.|Saya tambahkan satu hal.', '我们投票决定吧。|Wǒmen tóupiào juédìng ba.|Mari kita putuskan dengan voting.', '那就这么定了。|Nà jiù zhème dìng le.|Kalau begitu, diputuskan begitu.', '会后我把会议记录发给大家。|Huì hòu wǒ bǎ huìyì jìlù fā gěi dàjiā.|Setelah rapat saya kirimkan notulen ke semua.'],
      dialog: ['A|关于新工地的安全问题，大家有什么意见？|Guānyú xīn gōngdì de ānquán wèntí, dàjiā yǒu shénme yìjiàn?|Mengenai keselamatan di proyek baru, ada masukan apa?', 'B|我认为最主要的问题是工人没有戴安全帽。|Wǒ rènwéi zuì zhǔyào de wèntí shì gōngrén méiyǒu dài ānquánmào.|Menurut saya masalah utamanya adalah pekerja tidak memakai helm.', 'A|我同意。你有什么建议？|Wǒ tóngyì. Nǐ yǒu shénme jiànyì?|Saya setuju. Apa saranmu?', 'B|我建议每天早上开十分钟的安全会。|Wǒ jiànyì měitiān zǎoshang kāi shí fēnzhōng de ānquán huì.|Saya sarankan setiap pagi ada rapat keselamatan sepuluh menit.', 'A|好主意。另外，我补充一点：不戴安全帽的人不能进工地。|Hǎo zhǔyi. Lìngwài, wǒ bǔchōng yì diǎn: bú dài ānquánmào de rén bù néng jìn gōngdì.|Ide bagus. Selain itu, saya tambahkan: yang tidak memakai helm tidak boleh masuk proyek.', 'B|可是这样会不会影响进度？|Kěshì zhèyàng huì bu huì yǐngxiǎng jìndù?|Tetapi apakah ini akan memengaruhi progres?', 'A|安全比进度更重要。那就这么定了，下周一开始。|Ānquán bǐ jìndù gèng zhòngyào. Nà jiù zhème dìng le, xià zhōuyī kāishǐ.|Keselamatan lebih penting daripada progres. Diputuskan begitu, mulai Senin depan.', 'B|好的，我会通知所有的工人。|Hǎo de, wǒ huì tōngzhī suǒyǒu de gōngrén.|Baik, saya akan memberi tahu semua pekerja.'],
      resp: ['你对这个方案有什么看法？|Nǐ duì zhège fāng\'àn yǒu shénme kànfǎ?|Apa pandanganmu tentang rencana ini?|我觉得可行，但是成本有点儿高。:Wǒ juéde kěxíng, dànshì chéngběn yǒudiǎnr gāo.|我在开会。:Wǒ zài kāihuì.|我是经理。:Wǒ shì jīnglǐ.|Menurut saya layak, tetapi biayanya agak tinggi.', '能不能具体说一下？|Néng bu néng jùtǐ shuō yíxià?|Bisa dijelaskan lebih spesifik?|好的，例如运输成本太高。:Hǎo de, lìrú yùnshū chéngběn tài gāo.|不能，再见。:Bù néng, zàijiàn.|我很具体。:Wǒ hěn jùtǐ.|Baik, misalnya biaya transportasinya terlalu tinggi.', '我有不同的看法。|Wǒ yǒu bù tóng de kànfǎ.|Saya punya pandangan berbeda.|请说，我们听听你的意见。:Qǐng shuō, wǒmen tīngting nǐ de yìjiàn.|我也不同。:Wǒ yě bù tóng.|看法很好吃。:Kànfǎ hěn hǎochī.|Silakan, kami dengarkan pendapatmu.', '那就这么定了。|Nà jiù zhème dìng le.|Kalau begitu, diputuskan begitu.|好的，我会把会议记录发给大家。:Hǎo de, wǒ huì bǎ huìyì jìlù fā gěi dàjiā.|我没有定。:Wǒ méiyǒu dìng.|我不知道是谁。:Wǒ bù zhīdào shì shéi.|Baik, saya akan kirim notulen ke semua.'] },
    { id: 'h-r1', type: 'read', title: 'Tahun Baru Imlek', zh: '中国的春节 · Zhōngguó de Chūnjié',
      text: ['春节是中国最重要的传统节日，一般在一月底或者二月初。春节以前，人们打扫房子，买新衣服，贴春联，准备过年。|Chūnjié shì Zhōngguó zuì zhòngyào de chuántǒng jiérì, yìbān zài yī yuè dǐ huòzhě èr yuè chū. Chūnjié yǐqián, rénmen dǎsǎo fángzi, mǎi xīn yīfu, tiē chūnlián, zhǔnbèi guònián.|Imlek adalah hari raya tradisional terpenting di Tiongkok, biasanya jatuh pada akhir Januari atau awal Februari. Sebelum Imlek, orang membersihkan rumah, membeli baju baru, menempel bait Imlek, dan bersiap merayakan tahun baru.',
        '除夕晚上，不管离家多远，人们都要回家跟家人一起吃年夜饭。北方人喜欢包饺子，南方人常常吃鱼，因为“鱼”和“余”的发音一样，意思是每年都有剩余。|Chúxī wǎnshang, bùguǎn lí jiā duō yuǎn, rénmen dōu yào huí jiā gēn jiārén yìqǐ chī niányèfàn. Běifāng rén xǐhuan bāo jiǎozi, nánfāng rén chángcháng chī yú, yīnwèi “yú” hé “yú” de fāyīn yíyàng, yìsi shì měi nián dōu yǒu shèngyú.|Pada malam Tahun Baru, sejauh apa pun dari rumah, orang-orang pulang untuk makan malam tahun baru bersama keluarga. Orang utara suka membuat pangsit, orang selatan sering makan ikan, karena “ikan” (鱼 yú) dan “lebih” (余 yú) bunyinya sama, artinya setiap tahun selalu ada kelebihan rezeki.',
        '春节的时候，大人给孩子红包，朋友之间互相说“新年快乐”“恭喜发财”。现在很多人还用微信发电子红包。在印尼，春节也是公共假日，很多华人家庭会去庙里拜拜，还会看舞狮表演。|Chūnjié de shíhou, dàrén gěi háizi hóngbāo, péngyou zhī jiān hùxiāng shuō “xīnnián kuàilè” “gōngxǐ fācái”. Xiànzài hěn duō rén hái yòng Wēixìn fā diànzǐ hóngbāo. Zài Yìnní, Chūnjié yě shì gōnggòng jiàrì, hěn duō Huárén jiātíng huì qù miào li bàibai, hái huì kàn wǔshī biǎoyǎn.|Saat Imlek, orang dewasa memberi angpao kepada anak-anak, dan teman saling mengucapkan “Selamat Tahun Baru” dan “Semoga makmur”. Sekarang banyak orang juga mengirim angpao elektronik lewat WeChat. Di Indonesia, Imlek juga hari libur nasional; banyak keluarga Tionghoa bersembahyang ke kelenteng dan menonton pertunjukan barongsai.'],
      qs: ['Kapan biasanya Imlek jatuh?|Akhir Januari atau awal Februari|Akhir Desember|Pertengahan Maret', 'Mengapa orang selatan makan ikan saat Imlek?|Bunyi “ikan” sama dengan “lebih”|Ikan murah di selatan|Ikan lambang keberanian', 'Apa yang diberikan orang dewasa kepada anak-anak?|Angpao|Mainan|Kue bulan'],
      tf: ['Sebelum Imlek orang membersihkan rumah.|T', 'Orang utara suka membuat pangsit pada malam tahun baru.|T', 'Angpao hanya bisa diberikan dalam bentuk uang kertas.|F', 'Di Indonesia, Imlek bukan hari libur.|F'],
      gloss: ['传统|chuántǒng|tradisional', '春联|chūnlián|bait Imlek (kertas merah)', '除夕|Chúxī|malam Tahun Baru Imlek', '年夜饭|niányèfàn|makan malam tahun baru', '发音|fāyīn|pelafalan', '剩余|shèngyú|sisa, kelebihan', '公共假日|gōnggòng jiàrì|hari libur nasional', '舞狮|wǔshī|barongsai'] },
    { id: 'h-r2', type: 'read', title: 'Rahasia Belajar Mandarin', zh: '学好汉语的秘诀 · xué hǎo Hànyǔ de mìjué',
      text: ['很多人觉得汉语是世界上最难的语言之一。其实，汉语的语法比较简单：动词没有变化，也没有复杂的时态。真正的难点是声调和汉字。|Hěn duō rén juéde Hànyǔ shì shìjiè shang zuì nán de yǔyán zhī yī. Qíshí, Hànyǔ de yǔfǎ bǐjiào jiǎndān: dòngcí méiyǒu biànhuà, yě méiyǒu fùzá de shítài. Zhēnzhèng de nándiǎn shì shēngdiào hé Hànzì.|Banyak orang merasa bahasa Mandarin adalah salah satu bahasa tersulit di dunia. Sebenarnya, tata bahasanya cukup sederhana: kata kerja tidak berubah bentuk dan tidak ada kala yang rumit. Kesulitan sebenarnya adalah nada dan hanzi.',
        '要学好声调，最好的方法是多听多模仿。你可以每天听十五分钟的中文歌或者短视频，然后大声跟着说。只要坚持三个月，你的发音就会有很大的进步。|Yào xué hǎo shēngdiào, zuì hǎo de fāngfǎ shì duō tīng duō mófǎng. Nǐ kěyǐ měitiān tīng shíwǔ fēnzhōng de Zhōngwén gē huòzhě duǎn shìpín, ránhòu dàshēng gēnzhe shuō. Zhǐyào jiānchí sān ge yuè, nǐ de fāyīn jiù huì yǒu hěn dà de jìnbù.|Untuk menguasai nada, cara terbaik adalah banyak mendengar dan menirukan. Kamu bisa setiap hari mendengarkan lagu atau video pendek berbahasa Mandarin selama lima belas menit, lalu menirukannya dengan suara keras. Asalkan konsisten selama tiga bulan, pelafalanmu akan maju pesat.',
        '学汉字的时候，不要只是死记硬背。很多汉字是由几个部分组成的，例如“好”是“女”和“子”，“休”是一个人靠着一棵树休息。了解了汉字的结构，记起来就容易多了。最重要的是，不要害怕说错。只有多说，才能说得流利。|Xué Hànzì de shíhou, bú yào zhǐshì sǐjì yìngbèi. Hěn duō Hànzì shì yóu jǐ ge bùfen zǔchéng de, lìrú “hǎo” shì “nǚ” hé “zǐ”, “xiū” shì yí ge rén kàozhe yì kē shù xiūxi. Liǎojiě le Hànzì de jiégòu, jì qǐlai jiù róngyì duō le. Zuì zhòngyào de shì, bú yào hàipà shuō cuò. Zhǐyǒu duō shuō, cái néng shuō de liúlì.|Saat belajar hanzi, jangan hanya menghafal mati. Banyak hanzi tersusun dari beberapa bagian, misalnya 好 (baik) terdiri dari 女 (perempuan) dan 子 (anak), 休 (istirahat) adalah seseorang yang bersandar pada pohon. Setelah memahami strukturnya, hanzi jauh lebih mudah diingat. Yang paling penting, jangan takut salah bicara. Hanya dengan banyak berbicara, barulah kamu bisa lancar.'],
      qs: ['Menurut teks, bagian mana dari bahasa Mandarin yang cukup sederhana?|Tata bahasanya|Nadanya|Hanzinya', 'Apa cara terbaik menguasai nada?|Banyak mendengar dan menirukan|Menghafal tabel nada|Menulis pinyin setiap hari', 'Hanzi 休 digambarkan sebagai apa?|Orang bersandar pada pohon|Perempuan dan anak|Rumah dengan atap'],
      tf: ['Kata kerja Mandarin berubah bentuk sesuai waktu.|F', 'Teks menyarankan latihan mendengar 15 menit setiap hari.|T', 'Hanzi 好 terdiri dari 女 dan 子.|T', 'Teks menyarankan untuk tidak berbicara sampai benar-benar yakin.|F'],
      gloss: ['语法|yǔfǎ|tata bahasa', '声调|shēngdiào|nada', '模仿|mófǎng|menirukan', '坚持|jiānchí|konsisten, bertahan', '死记硬背|sǐjì yìngbèi|menghafal mati', '组成|zǔchéng|tersusun dari', '结构|jiégòu|struktur', '流利|liúlì|lancar'] }
  ]

    { id: 'a-t1', type: 'topic', cat: 'work', title: 'Presentasi & Laporan Lisan', zh: '演讲汇报 · yǎnjiǎng huìbào',
      phrases: ['各位领导、各位同事，大家好！|Gèwèi lǐngdǎo, gèwèi tóngshì, dàjiā hǎo!|Para pimpinan dan rekan-rekan sekalian, salam sejahtera!', '今天我想跟大家分享三个方面。|Jīntiān wǒ xiǎng gēn dàjiā fēnxiǎng sān ge fāngmiàn.|Hari ini saya ingin berbagi tiga hal.', '首先，我介绍一下项目背景。|Shǒuxiān, wǒ jièshào yíxià xiàngmù bèijǐng.|Pertama, saya perkenalkan latar belakang proyek.', '其次，我们来看一下数据。|Qícì, wǒmen lái kàn yíxià shùjù.|Kedua, mari kita lihat datanya.', '最后，我谈谈下一步的计划。|Zuìhòu, wǒ tántan xià yí bù de jìhuà.|Terakhir, saya bahas rencana langkah berikutnya.', '从这张图可以看出，销量增长了一倍。|Cóng zhè zhāng tú kěyǐ kàn chū, xiāoliàng zēngzhǎng le yí bèi.|Dari grafik ini terlihat, penjualan naik dua kali lipat.', '总的来说，项目进展顺利。|Zǒng de lái shuō, xiàngmù jìnzhǎn shùnlì.|Secara keseluruhan, proyek berjalan lancar.', '这一点非常关键。|Zhè yì diǎn fēicháng guānjiàn.|Poin ini sangat krusial.', '以上就是我的汇报。|Yǐshàng jiù shì wǒ de huìbào.|Demikian laporan saya.', '谢谢大家！欢迎提问。|Xièxie dàjiā! Huānyíng tíwèn.|Terima kasih semua! Silakan bertanya.', '这个问题问得很好。|Zhège wèntí wèn de hěn hǎo.|Pertanyaan yang bagus.', '我会后再详细回答您。|Wǒ huì hòu zài xiángxì huídá nín.|Saya akan menjawab lebih rinci setelah rapat.'],
      dialog: ['A|各位领导，大家好！今天我汇报一下雅加达项目的进展情况。|Gèwèi lǐngdǎo, dàjiā hǎo! Jīntiān wǒ huìbào yíxià Yǎjiādá xiàngmù de jìnzhǎn qíngkuàng.|Para pimpinan, salam sejahtera! Hari ini saya melaporkan perkembangan proyek Jakarta.', 'A|首先，从这张图可以看出，工程已经完成了百分之六十五。|Shǒuxiān, cóng zhè zhāng tú kěyǐ kàn chū, gōngchéng yǐjīng wánchéng le bǎi fēn zhī liùshíwǔ.|Pertama, dari grafik ini terlihat pekerjaan sudah selesai 65%.', 'B|比计划快还是慢？|Bǐ jìhuà kuài háishi màn?|Lebih cepat atau lebih lambat dari rencana?', 'A|比计划慢了两周，主要是由于雨季的影响。|Bǐ jìhuà màn le liǎng zhōu, zhǔyào shì yóuyú yǔjì de yǐngxiǎng.|Terlambat dua minggu dari rencana, terutama karena pengaruh musim hujan.', 'B|有什么补救措施吗？|Yǒu shénme bǔjiù cuòshī ma?|Apa ada langkah perbaikan?', 'A|我们打算增加一个班组，并且周末加班，从而把时间追回来。|Wǒmen dǎsuan zēngjiā yí ge bānzǔ, bìngqiě zhōumò jiābān, cóng\'ér bǎ shíjiān zhuī huílai.|Kami berencana menambah satu regu kerja dan lembur akhir pekan, sehingga waktunya bisa dikejar.', 'B|成本会增加多少？|Chéngběn huì zēngjiā duōshao?|Biayanya bertambah berapa?', 'A|这个问题问得很好。大约增加百分之三，详细数据我会后发给您。|Zhège wèntí wèn de hěn hǎo. Dàyuē zēngjiā bǎi fēn zhī sān, xiángxì shùjù wǒ huì hòu fā gěi nín.|Pertanyaan bagus. Sekitar 3%, data rincinya saya kirim setelah rapat.'],
      resp: ['你的汇报讲完了吗？|Nǐ de huìbào jiǎng wán le ma?|Laporanmu sudah selesai?|讲完了，以上就是我的汇报。:Jiǎng wán le, yǐshàng jiù shì wǒ de huìbào.|首先介绍背景。:Shǒuxiān jièshào bèijǐng.|我没有汇报。:Wǒ méiyǒu huìbào.|Sudah, demikian laporan saya.', '这些数据是从哪儿来的？|Zhèxiē shùjù shì cóng nǎr lái de?|Data ini dari mana?|是根据公司的销售报告整理的。:Shì gēnjù gōngsī de xiāoshòu bàogào zhěnglǐ de.|是昨天来的。:Shì zuótiān lái de.|数据很多。:Shùjù hěn duō.|Disusun berdasarkan laporan penjualan perusahaan.', '成本会增加多少？|Chéngběn huì zēngjiā duōshao?|Biayanya bertambah berapa?|大约百分之三，详细数据会后发给您。:Dàyuē bǎi fēn zhī sān, xiángxì shùjù huì hòu fā gěi nín.|成本很重要。:Chéngběn hěn zhòngyào.|我们增加了一个班组。:Wǒmen zēngjiā le yí ge bānzǔ.|Sekitar 3%, data rinci saya kirim setelah rapat.', '大家还有问题吗？|Dàjiā hái yǒu wèntí ma?|Ada pertanyaan lagi?|没有了，谢谢你的精彩汇报。:Méiyǒu le, xièxie nǐ de jīngcǎi huìbào.|问题问得很好。:Wèntí wèn de hěn hǎo.|欢迎提问。:Huānyíng tíwèn.|Tidak ada, terima kasih atas laporan yang bagus.'] },

    { id: 'a-g2', type: 'grammar', title: 'Unsur Klasik dalam Bahasa Tulis', zh: '文言词 · wényán cí',
      explain: '<p>Berita, kontrak, pengumuman, dan laporan resmi memakai beberapa kata dari <b>bahasa Tionghoa klasik</b> (文言). Kata-kata ini jarang dipakai dalam obrolan, tetapi wajib dikenali untuk membaca dokumen.</p><table class="gt"><tr><th>Klasik</th><th>Setara modern</th><th>Contoh</th></tr><tr><td>之 zhī</td><td>的</td><td>最难的语言之一 (salah satu yang tersulit)</td></tr><tr><td>于 yú</td><td>在 / 对 / 从 / 比</td><td>成立于1998年 (didirikan pada 1998)</td></tr><tr><td>以 yǐ</td><td>用 / 为了 / 把</td><td>以质量为第一 (menjadikan kualitas utama)</td></tr><tr><td>其 qí</td><td>他(们)的 / 它的</td><td>其质量很好 (kualitasnya bagus)</td></tr><tr><td>则 zé</td><td>就</td><td>如有问题，则 … (jika ada masalah, maka …)</td></tr><tr><td>而 ér</td><td>而且 / 但是</td><td>对双方而言 (bagi kedua pihak)</td></tr><tr><td>该 gāi</td><td>这个 (yang disebut tadi)</td><td>该公司 (perusahaan tersebut)</td></tr></table><p class="tip">Pola tetap yang sering muncul: <b>…之一</b> (salah satu), <b>于 + waktu</b> (pada), <b>对 … 而言</b> (bagi …), <b>如 … 则 …</b> (jika … maka …).</p>',
      pattern: ['之 = 的 · 于 = 在 / 对 / 从 · 以 = 用 / 为了', '其 = 他(们)的 / 它的 · 则 = 就 · 该 = tersebut', '… 之一 · 于 + waktu · 对 … 而言'],
      examples: ['这是世界上最难的语言之一。|Zhè shì shìjiè shang zuì nán de yǔyán zhī yī.|Ini salah satu bahasa tersulit di dunia.', '会议将于明天上午九点举行。|Huìyì jiāng yú míngtiān shàngwǔ jiǔ diǎn jǔxíng.|Rapat akan diadakan besok pukul sembilan pagi.', '该公司成立于一九九八年。|Gāi gōngsī chénglì yú yī jiǔ jiǔ bā nián.|Perusahaan tersebut didirikan pada tahun 1998.', '我们以质量为第一。|Wǒmen yǐ zhìliàng wéi dì-yī.|Kami menjadikan kualitas yang utama.', '请于本月底之前付款。|Qǐng yú běn yuè dǐ zhīqián fùkuǎn.|Mohon lakukan pembayaran sebelum akhir bulan ini.', '该产品价格低，其质量却很好。|Gāi chǎnpǐn jiàgé dī, qí zhìliàng què hěn hǎo.|Harga produk tersebut rendah, namun kualitasnya bagus.', '如有问题，则请联系我们。|Rú yǒu wèntí, zé qǐng liánxì wǒmen.|Apabila ada masalah, silakan hubungi kami.', '此次合作对双方而言都很重要。|Cǐ cì hézuò duì shuāngfāng ér yán dōu hěn zhòngyào.|Kerja sama kali ini penting bagi kedua belah pihak.'],
      quiz: ['这是世界上最难的语言___一。|Zhè shì shìjiè shang zuì nán de yǔyán ___ yī.|之:zhī|于:yú|则:zé|Ini salah satu bahasa tersulit di dunia.', '会议将___明天上午九点举行。|Huìyì jiāng ___ míngtiān shàngwǔ jiǔ diǎn jǔxíng.|于:yú|之:zhī|其:qí|Rapat akan diadakan besok pukul sembilan pagi.', '该公司成立___一九九八年。|Gāi gōngsī chénglì ___ yī jiǔ jiǔ bā nián.|于:yú|以:yǐ|则:zé|Perusahaan tersebut didirikan pada tahun 1998.', '我们___质量为第一。|Wǒmen ___ zhìliàng wéi dì-yī.|以:yǐ|于:yú|之:zhī|Kami menjadikan kualitas yang utama.', '该产品价格低，___质量却很好。|Gāi chǎnpǐn jiàgé dī, ___ zhìliàng què hěn hǎo.|其:qí|之:zhī|于:yú|Harga produk tersebut rendah, namun kualitasnya bagus.', '如有问题，___请联系我们。|Rú yǒu wèntí, ___ qǐng liánxì wǒmen.|则:zé|其:qí|之:zhī|Apabila ada masalah, silakan hubungi kami.', '请___本月底之前付款。|Qǐng ___ běn yuè dǐ zhīqián fùkuǎn.|于:yú|以:yǐ|其:qí|Mohon bayar sebelum akhir bulan ini.', '此次合作对双方___言都很重要。|Cǐ cì hézuò duì shuāngfāng ___ yán dōu hěn zhòngyào.|而:ér|之:zhī|则:zé|Kerja sama kali ini penting bagi kedua pihak.']
    },
    { id: 'a-t2', type: 'topic', cat: 'project', title: 'Rapat Proyek & Laporan Progres', zh: '工程例会 · gōngchéng lìhuì',
      phrases: ['现在的施工进度怎么样？|Xiànzài de shīgōng jìndù zěnmeyàng?|Bagaimana progres pekerjaan sekarang?', '基础工程已经完成了。|Jīchǔ gōngchéng yǐjīng wánchéng le.|Pekerjaan pondasi sudah selesai.', '混凝土明天浇筑。|Hùnníngtǔ míngtiān jiāozhù.|Beton dicor besok.', '钢筋还没到工地。|Gāngjīn hái méi dào gōngdì.|Besi tulangan belum sampai di lokasi.', '材料供应跟不上。|Cáiliào gōngyìng gēn bu shàng.|Pasokan material tidak terkejar.', '这个图纸需要修改。|Zhège túzhǐ xūyào xiūgǎi.|Gambar ini perlu direvisi.', '请按照图纸施工。|Qǐng ànzhào túzhǐ shīgōng.|Kerjakan sesuai gambar.', '质量检查合格了吗？|Zhìliàng jiǎnchá hégé le ma?|Pemeriksaan mutu sudah lolos?', '安全第一，请戴好安全帽。|Ānquán dì-yī, qǐng dài hǎo ānquánmào.|Keselamatan nomor satu, pakai helm dengan benar.', '工期很紧，必须加班。|Gōngqī hěn jǐn, bìxū jiābān.|Waktu pelaksanaan ketat, harus lembur.', '这个问题我们要尽快解决。|Zhège wèntí wǒmen yào jǐnkuài jiějué.|Masalah ini harus segera kita selesaikan.', '明天早上八点在现场开会。|Míngtiān zǎoshang bā diǎn zài xiànchǎng kāihuì.|Besok jam delapan pagi rapat di lapangan.'],
      dialog: ['A|李工，这个星期的施工进度怎么样？|Lǐ gōng, zhège xīngqī de shīgōng jìndù zěnmeyàng?|Pak Insinyur Li, bagaimana progres minggu ini?', 'B|二楼的柱子已经浇筑完了，楼板下周开始。|Èr lóu de zhùzi yǐjīng jiāozhù wán le, lóubǎn xià zhōu kāishǐ.|Kolom lantai dua sudah selesai dicor, pelat lantai mulai minggu depan.', 'A|比计划晚了几天？|Bǐ jìhuà wǎn le jǐ tiān?|Terlambat berapa hari dari rencana?', 'B|晚了三天，主要是因为钢筋供应跟不上。|Wǎn le sān tiān, zhǔyào shì yīnwèi gāngjīn gōngyìng gēn bu shàng.|Terlambat tiga hari, terutama karena pasokan besi tulangan tidak terkejar.', 'A|供应商怎么说？|Gōngyìngshāng zěnme shuō?|Apa kata pemasok?', 'B|他们保证星期四以前把剩下的钢筋送到。|Tāmen bǎozhèng xīngqīsì yǐqián bǎ shèng xia de gāngjīn sòng dào.|Mereka menjamin sisa besi tulangan dikirim sebelum hari Kamis.', 'A|好。混凝土试块的检测结果出来了吗？|Hǎo. Hùnníngtǔ shìkuài de jiǎncè jiéguǒ chūlai le ma?|Baik. Hasil uji sampel beton sudah keluar?', 'B|出来了，强度都合格。报告我下午发给您。|Chūlai le, qiángdù dōu hégé. Bàogào wǒ xiàwǔ fā gěi nín.|Sudah, kekuatannya semua memenuhi syarat. Laporannya saya kirim sore ini.'],
      resp: ['现在的施工进度怎么样？|Xiànzài de shīgōng jìndù zěnmeyàng?|Bagaimana progres pekerjaan sekarang?|完成了百分之七十，比计划快两天。:Wánchéng le bǎi fēn zhī qīshí, bǐ jìhuà kuài liǎng tiān.|我们明天开会。:Wǒmen míngtiān kāihuì.|钢筋很重。:Gāngjīn hěn zhòng.|Sudah 70%, dua hari lebih cepat dari rencana.', '钢筋什么时候到？|Gāngjīn shénme shíhou dào?|Besi tulangan kapan sampai?|供应商说星期四以前送到。:Gōngyìngshāng shuō xīngqīsì yǐqián sòng dào.|钢筋在二楼。:Gāngjīn zài èr lóu.|强度合格了。:Qiángdù hégé le.|Pemasok bilang sampai sebelum Kamis.', '质量检查合格了吗？|Zhìliàng jiǎnchá hégé le ma?|Pemeriksaan mutu sudah lolos?|合格了，报告下午发给您。:Hégé le, bàogào xiàwǔ fā gěi nín.|还没浇筑。:Hái méi jiāozhù.|请戴好安全帽。:Qǐng dài hǎo ānquánmào.|Sudah lolos, laporannya saya kirim sore ini.', '这个图纸有问题。|Zhège túzhǐ yǒu wèntí.|Gambar ini ada masalah.|好的，我马上让设计院修改。:Hǎo de, wǒ mǎshàng ràng shèjìyuàn xiūgǎi.|图纸很漂亮。:Túzhǐ hěn piàoliang.|我们按照计划。:Wǒmen ànzhào jìhuà.|Baik, saya segera minta konsultan desain merevisinya.'] },

    { id: 'a-g3', type: 'grammar', title: 'Retorika & Penekanan', zh: '强调与反问 · qiángdiào yǔ fǎnwèn',
      explain: '<p>Penutur mahir memakai pola berikut untuk menekankan perasaan dan pendapat:</p><ul><li><b>难道 … 吗？</b> = masa …? (pertanyaan retoris, sebenarnya menyatakan kebalikannya): 难道你不知道吗？ = kamu pasti tahu.</li><li><b>何必 … 呢？</b> = buat apa …? (tidak perlu): 何必这么客气呢？</li><li><b>不得不 + kata kerja</b> = terpaksa: 我们不得不改坐火车。</li><li><b>非 … 不可</b> = harus, mau tidak mau: 这件事非你去不可。</li><li><b>简直</b> = benar-benar, sungguh (melebih-lebihkan): 简直太好吃了！</li></ul><p class="tip">难道 dan 何必 terdengar tajam. Dalam situasi formal, sampaikan dengan nada lembut atau ganti dengan 是不是 … 呢？</p>',
      pattern: ['难道 + … + 吗？', '何必 + kata kerja + 呢？', 'Subjek + 不得不 + kata kerja', '非 + orang / tindakan + 不可', '简直 + kata sifat / kalimat'],
      examples: ['难道你不知道吗？|Nándào nǐ bù zhīdào ma?|Masa kamu tidak tahu?', '这么简单的问题，难道还要问老师吗？|Zhème jiǎndān de wèntí, nándào hái yào wèn lǎoshī ma?|Soal semudah ini, masa masih perlu tanya guru?', '都是朋友，何必这么客气呢？|Dōu shì péngyou, hébì zhème kèqi ne?|Kita kan teman, buat apa sungkan begitu?', '飞机取消了，我们不得不改坐火车。|Fēijī qǔxiāo le, wǒmen bùdébù gǎi zuò huǒchē.|Pesawat dibatalkan, kami terpaksa ganti naik kereta.', '这件事非你去不可。|Zhè jiàn shì fēi nǐ qù bùkě.|Urusan ini harus kamu sendiri yang pergi.', '这个菜简直太好吃了！|Zhège cài jiǎnzhí tài hǎochī le!|Masakan ini benar-benar enak sekali!', '他说的话简直让人无法相信。|Tā shuō de huà jiǎnzhí ràng rén wúfǎ xiāngxìn.|Kata-katanya sungguh tidak bisa dipercaya.', '时间不多了，我们不得不加快速度。|Shíjiān bù duō le, wǒmen bùdébù jiākuài sùdù.|Waktu tinggal sedikit, kita terpaksa mempercepat.'],
      quiz: ['___你不知道吗？|___ nǐ bù zhīdào ma?|难道:Nándào|何必:Hébì|简直:Jiǎnzhí|Masa kamu tidak tahu?', '都是朋友，___这么客气呢？|Dōu shì péngyou, ___ zhème kèqi ne?|何必:hébì|不得不:bùdébù|简直:jiǎnzhí|Kita kan teman, buat apa sungkan begitu?', '飞机取消了，我们___改坐火车。|Fēijī qǔxiāo le, wǒmen ___ gǎi zuò huǒchē.|不得不:bùdébù|何必:hébì|简直:jiǎnzhí|Pesawat dibatalkan, kami terpaksa naik kereta.', '这件事非你去___。|Zhè jiàn shì fēi nǐ qù ___.|不可:bùkě|不得:bùdé|不必:búbì|Urusan ini harus kamu sendiri yang pergi.', '这个菜___太好吃了！|Zhège cài ___ tài hǎochī le!|简直:jiǎnzhí|难道:nándào|何必:hébì|Masakan ini benar-benar enak!', '这件事___你去不可。|Zhè jiàn shì ___ nǐ qù bùkě.|非:fēi|不:bù|没:méi|Urusan ini harus kamu yang pergi.', '时间不多了，我们___加快速度。|Shíjiān bù duō le, wǒmen ___ jiākuài sùdù.|不得不:bùdébù|何必:hébì|难道:nándào|Waktu tinggal sedikit, kita terpaksa mempercepat.', '这么简单的问题，难道还要问老师___？|Zhème jiǎndān de wèntí, nándào hái yào wèn lǎoshī ___?|吗:ma|的:de|了:le|Soal semudah ini, masa perlu tanya guru?']
    },
    { id: 'a-t3', type: 'topic', cat: 'daily', title: 'Berdiskusi & Berdebat dengan Sopan', zh: '讨论与辩论 · tǎolùn yǔ biànlùn',
      phrases: ['你怎么看这个问题？|Nǐ zěnme kàn zhège wèntí?|Bagaimana kamu melihat masalah ini?', '在我看来，利大于弊。|Zài wǒ kàn lái, lì dà yú bì.|Menurut saya, manfaatnya lebih besar daripada kerugiannya.', '我部分同意你的观点。|Wǒ bùfen tóngyì nǐ de guāndiǎn.|Saya setuju sebagian dengan pendapatmu.', '恕我直言，我觉得这样不太合理。|Shù wǒ zhíyán, wǒ juéde zhèyàng bú tài hélǐ.|Maaf saya bicara terus terang, menurut saya ini kurang masuk akal.', '你说得有道理，不过……|Nǐ shuō de yǒu dàolǐ, búguò……|Katamu masuk akal, tetapi…', '从另一个角度来看……|Cóng lìng yí ge jiǎodù lái kàn……|Dilihat dari sudut lain…', '举个例子来说……|Jǔ ge lìzi lái shuō……|Sebagai contoh…', '这要看具体情况。|Zhè yào kàn jùtǐ qíngkuàng.|Itu tergantung situasinya.', '我们求同存异吧。|Wǒmen qiú tóng cún yì ba.|Mari kita cari kesamaan dan hargai perbedaan.', '我不这么认为。|Wǒ bú zhème rènwéi.|Saya tidak berpendapat begitu.', '这个话题很有争议。|Zhège huàtí hěn yǒu zhēngyì.|Topik ini sangat kontroversial.', '归根结底，关键在于教育。|Guīgēn jiédǐ, guānjiàn zàiyú jiàoyù.|Pada akhirnya, kuncinya terletak pada pendidikan.'],
      dialog: ['A|你怎么看人工智能？很多人担心它会让人失业。|Nǐ zěnme kàn réngōng zhìnéng? Hěn duō rén dānxīn tā huì ràng rén shīyè.|Bagaimana pandanganmu soal AI? Banyak orang khawatir AI membuat orang kehilangan pekerjaan.', 'B|在我看来，利大于弊。它可以帮我们做很多重复的工作。|Zài wǒ kàn lái, lì dà yú bì. Tā kěyǐ bāng wǒmen zuò hěn duō chóngfù de gōngzuò.|Menurut saya, manfaatnya lebih besar. AI bisa membantu banyak pekerjaan yang berulang.', 'A|你说得有道理，不过有些工作确实会消失。|Nǐ shuō de yǒu dàolǐ, búguò yǒuxiē gōngzuò quèshí huì xiāoshī.|Katamu masuk akal, tetapi beberapa pekerjaan memang akan hilang.', 'B|没错，但同时也会出现新的工作，比如数据分析师。|Méi cuò, dàn tóngshí yě huì chūxiàn xīn de gōngzuò, bǐrú shùjù fēnxīshī.|Betul, tetapi di saat yang sama muncul pekerjaan baru, misalnya analis data.', 'A|问题是，普通工人难道能马上学会这些新技能吗？|Wèntí shì, pǔtōng gōngrén nándào néng mǎshàng xué huì zhèxiē xīn jìnéng ma?|Masalahnya, masa pekerja biasa bisa langsung menguasai keterampilan baru itu?', 'B|这要看具体情况。所以政府和企业都应该提供培训。|Zhè yào kàn jùtǐ qíngkuàng. Suǒyǐ zhèngfǔ hé qǐyè dōu yīnggāi tígōng péixùn.|Itu tergantung situasinya. Karena itu pemerintah dan perusahaan harus menyediakan pelatihan.', 'A|这一点我完全同意。归根结底，关键在于教育。|Zhè yì diǎn wǒ wánquán tóngyì. Guīgēn jiédǐ, guānjiàn zàiyú jiàoyù.|Soal ini saya sepenuhnya setuju. Pada akhirnya, kuncinya pendidikan.', 'B|看来我们的观点也没有那么不同嘛。|Kàn lái wǒmen de guāndiǎn yě méiyǒu nàme bù tóng ma.|Sepertinya pandangan kita tidak begitu berbeda, ya.'],
      resp: ['你怎么看这个问题？|Nǐ zěnme kàn zhège wèntí?|Bagaimana kamu melihat masalah ini?|在我看来，这要看具体情况。:Zài wǒ kàn lái, zhè yào kàn jùtǐ qíngkuàng.|我用眼睛看。:Wǒ yòng yǎnjing kàn.|我没看过。:Wǒ méi kàn guo.|Menurut saya, itu tergantung situasinya.', '我觉得这个政策不太合理。|Wǒ juéde zhège zhèngcè bú tài hélǐ.|Menurut saya kebijakan ini kurang masuk akal.|你说得有道理，不过也有好的一面。:Nǐ shuō de yǒu dàolǐ, búguò yě yǒu hǎo de yí miàn.|一路平安！:Yílù píng\'ān!|恭喜发财！:Gōngxǐ fācái!|Masuk akal, tetapi ada sisi baiknya juga.', '你同意我的观点吗？|Nǐ tóngyì wǒ de guāndiǎn ma?|Kamu setuju dengan pendapatku?|我部分同意。:Wǒ bùfen tóngyì.|我不认识你。:Wǒ bú rènshi nǐ.|我很高兴。:Wǒ hěn gāoxìng.|Saya setuju sebagian.', '看来我们的意见不一样。|Kàn lái wǒmen de yìjiàn bù yíyàng.|Sepertinya pendapat kita berbeda.|没关系，我们求同存异吧。:Méi guānxi, wǒmen qiú tóng cún yì ba.|对不起，我走错了。:Duìbuqǐ, wǒ zǒu cuò le.|我们一样高。:Wǒmen yíyàng gāo.|Tidak apa-apa, mari cari kesamaan dan hargai perbedaan.'] },
    { id: 'a-r1', type: 'read', title: 'Kecerdasan Buatan & Masa Depan Pekerjaan', zh: '人工智能与未来的工作',
      text: ['近年来，人工智能技术发展迅速，已经广泛应用于医疗、金融、交通和教育等领域。人们只需要输入几句话，人工智能就能写文章、翻译文件，甚至编写程序。|Jìnnián lái, réngōng zhìnéng jìshù fāzhǎn xùnsù, yǐjīng guǎngfàn yìngyòng yú yīliáo, jīnróng, jiāotōng hé jiàoyù děng lǐngyù. Rénmen zhǐ xūyào shūrù jǐ jù huà, réngōng zhìnéng jiù néng xiě wénzhāng, fānyì wénjiàn, shènzhì biānxiě chéngxù.|Beberapa tahun terakhir, teknologi kecerdasan buatan berkembang pesat dan telah diterapkan secara luas di bidang kesehatan, keuangan, transportasi, dan pendidikan. Orang cukup memasukkan beberapa kalimat, dan AI bisa menulis artikel, menerjemahkan dokumen, bahkan menulis program.',
        '由于人工智能效率高、成本低，不少企业开始用它代替部分重复性的工作。有研究认为，未来十年内，全球可能有数亿个工作岗位受到影响。因此，许多人担心自己会失业。|Yóuyú réngōng zhìnéng xiàolǜ gāo, chéngběn dī, bù shǎo qǐyè kāishǐ yòng tā dàitì bùfen chóngfùxìng de gōngzuò. Yǒu yánjiū rènwéi, wèilái shí nián nèi, quánqiú kěnéng yǒu shù yì ge gōngzuò gǎngwèi shòu dào yǐngxiǎng. Yīncǐ, xǔduō rén dānxīn zìjǐ huì shīyè.|Karena AI efisien dan murah, banyak perusahaan mulai menggunakannya untuk menggantikan sebagian pekerjaan yang berulang. Sebuah penelitian memperkirakan, dalam sepuluh tahun ke depan, ratusan juta lapangan kerja di dunia mungkin terdampak. Karena itu, banyak orang khawatir akan kehilangan pekerjaan.',
        '然而，历史告诉我们，每一次技术革命在淘汰旧工作的同时，也创造了新的工作。关键在于，我们能否不断学习，掌握与人工智能合作的能力。正如一位专家所说：“取代你的不是人工智能，而是会使用人工智能的人。”|Rán\'ér, lìshǐ gàosu wǒmen, měi yí cì jìshù gémìng zài táotài jiù gōngzuò de tóngshí, yě chuàngzào le xīn de gōngzuò. Guānjiàn zàiyú, wǒmen néng fǒu búduàn xuéxí, zhǎngwò yǔ réngōng zhìnéng hézuò de nénglì. Zhèngrú yí wèi zhuānjiā suǒ shuō: “Qǔdài nǐ de bú shì réngōng zhìnéng, ér shì huì shǐyòng réngōng zhìnéng de rén.”|Namun, sejarah mengajarkan bahwa setiap revolusi teknologi, selain menyingkirkan pekerjaan lama, juga menciptakan pekerjaan baru. Kuncinya terletak pada apakah kita mampu terus belajar dan menguasai kemampuan bekerja sama dengan AI. Seperti kata seorang pakar: “Yang menggantikanmu bukan AI, melainkan orang yang bisa menggunakan AI.”'],
      qs: ['Menurut teks, mengapa perusahaan memakai AI?|Efisien dan biayanya rendah|Diwajibkan pemerintah|Karyawan menolak bekerja', 'Apa yang diajarkan sejarah menurut teks?|Revolusi teknologi juga menciptakan pekerjaan baru|Teknologi selalu merugikan pekerja|Pekerjaan lama tidak pernah hilang', 'Menurut pakar, siapa yang akan menggantikanmu?|Orang yang bisa menggunakan AI|AI itu sendiri|Robot pabrik'],
      tf: ['AI hanya dipakai di bidang pendidikan.|F', 'Sebuah penelitian memperkirakan ratusan juta pekerjaan bisa terdampak.|T', 'Teks menyimpulkan bahwa kunci menghadapi AI adalah terus belajar.|T', 'Teks menyarankan orang menolak memakai AI.|F'],
      gloss: ['迅速|xùnsù|pesat, cepat', '应用于|yìngyòng yú|diterapkan pada', '甚至|shènzhì|bahkan', '代替|dàitì|menggantikan', '岗位|gǎngwèi|posisi kerja', '淘汰|táotài|menyingkirkan', '能否|néng fǒu|mampu atau tidak', '取代|qǔdài|menggantikan'] },
    { id: 'a-r2', type: 'read', title: 'Industri Nikel Indonesia', zh: '印尼的镍产业 · Yìnní de niè chǎnyè',
      text: ['印尼是世界上镍资源最丰富的国家之一。镍是制造不锈钢和电动汽车电池的重要原料。过去，印尼主要出口镍矿石，附加值很低。|Yìnní shì shìjiè shang niè zīyuán zuì fēngfù de guójiā zhī yī. Niè shì zhìzào búxiùgāng hé diàndòng qìchē diànchí de zhòngyào yuánliào. Guòqù, Yìnní zhǔyào chūkǒu niè kuàngshí, fùjiāzhí hěn dī.|Indonesia adalah salah satu negara dengan cadangan nikel terbesar di dunia. Nikel merupakan bahan baku penting untuk baja tahan karat dan baterai mobil listrik. Dulu, Indonesia terutama mengekspor bijih nikel yang nilai tambahnya rendah.',
        '二〇二〇年起，印尼政府禁止出口镍矿石，鼓励企业在国内建设冶炼厂。此后，包括中国企业在内的大量外资进入苏拉威西等地区，建起了大型工业园区，创造了数以万计的就业机会。|Èr líng èr líng nián qǐ, Yìnní zhèngfǔ jìnzhǐ chūkǒu niè kuàngshí, gǔlì qǐyè zài guónèi jiànshè yěliànchǎng. Cǐhòu, bāokuò Zhōngguó qǐyè zài nèi de dàliàng wàizī jìnrù Sūlāwēixī děng dìqū, jiàn qǐ le dàxíng gōngyè yuánqū, chuàngzào le shù yǐ wàn jì de jiùyè jīhuì.|Mulai tahun 2020, pemerintah Indonesia melarang ekspor bijih nikel dan mendorong perusahaan membangun smelter di dalam negeri. Sejak itu, banyak investasi asing, termasuk dari perusahaan Tiongkok, masuk ke daerah seperti Sulawesi dan membangun kawasan industri besar yang menciptakan puluhan ribu lapangan kerja.',

      dialog: ['A|老板，这个包怎么卖？|Lǎobǎn, zhège bāo zěnme mài?|Bos, tas ini dijual berapa?', 'B|一百二十块。真皮的，质量很好。|Yìbǎi èrshí kuài. Zhēnpí de, zhìliàng hěn hǎo.|120 yuan. Kulit asli, kualitasnya bagus.', 'A|太贵了！八十块行不行？|Tài guì le! Bāshí kuài xíng bu xíng?|Terlalu mahal! 80 yuan bisa?', 'B|八十块不行，我进价都一百。一百一吧。|Bāshí kuài bù xíng, wǒ jìnjià dōu yìbǎi. Yìbǎi yī ba.|80 tidak bisa, modal saya saja 100. 110 deh.', 'A|别家才卖九十块。算了，我再看看。|Bié jiā cái mài jiǔshí kuài. Suàn le, wǒ zài kànkan.|Toko lain cuma 90. Ya sudah, saya lihat-lihat dulu.', 'B|哎，别走！一百块，最低价了。|Āi, bié zǒu! Yìbǎi kuài, zuì dī jià le.|Eh, jangan pergi! 100 yuan, harga terendah.', 'A|九十五，我买两个。|Jiǔshíwǔ, wǒ mǎi liǎng ge.|95, saya beli dua.', 'B|好吧，成交！两个一百九。|Hǎo ba, chéngjiāo! Liǎng ge yìbǎi jiǔ.|Baiklah, deal! Dua jadi 190.'],
      resp: ['这个怎么卖？|Zhège zěnme mài?|Ini dijual berapa?|三十块一个。:Sānshí kuài yí ge.|我不卖。:Wǒ bú mài.|我买两个。:Wǒ mǎi liǎng ge.|30 yuan satu.', '便宜点儿吧！|Piányi diǎnr ba!|Kurangi sedikit!|好吧，给你打个折。:Hǎo ba, gěi nǐ dǎ ge zhé.|不客气。:Bú kèqi.|我很便宜。:Wǒ hěn piányi.|Baiklah, saya kasih diskon.', '最低多少钱？|Zuì dī duōshao qián?|Paling murah berapa?|最低八十块。:Zuì dī bāshí kuài.|八十岁。:Bāshí suì.|最低的那个。:Zuì dī de nàge.|Paling murah 80 yuan.', '五十块，行不行？|Wǔshí kuài, xíng bu xíng?|50 yuan, bisa?|行，成交！:Xíng, chéngjiāo!|我走路。:Wǒ zǒulù.|五点见。:Wǔ diǎn jiàn.|Bisa, deal!'] },
    { id: 'k-t5', type: 'topic', cat: 'travel', title: 'Naik Taksi & Didi', zh: '打车 · dǎchē',
      phrases: ['师傅，去机场。|Shīfu, qù jīchǎng.|Pak, ke bandara.', '请到这个地址。|Qǐng dào zhège dìzhǐ.|Tolong ke alamat ini.', '我用滴滴叫了车。|Wǒ yòng Dīdī jiào le chē.|Saya sudah pesan mobil lewat Didi.', '你的车牌号是多少？|Nǐ de chēpái hào shì duōshao?|Nomor pelat mobilmu berapa?', '我在路边等你。|Wǒ zài lùbiān děng nǐ.|Saya tunggu di pinggir jalan.', '大概要多长时间？|Dàgài yào duō cháng shíjiān?|Kira-kira butuh berapa lama?', '请开慢一点儿。|Qǐng kāi màn yìdiǎnr.|Tolong menyetir lebih pelan.', '我赶时间，能快点儿吗？|Wǒ gǎn shíjiān, néng kuài diǎnr ma?|Saya buru-buru, bisa lebih cepat?', '前面路口停一下。|Qiánmiàn lùkǒu tíng yíxià.|Berhenti sebentar di perempatan depan.', '就在这儿下车。|Jiù zài zhèr xià chē.|Saya turun di sini saja.', '请打开后备箱。|Qǐng dǎkāi hòubèixiāng.|Tolong buka bagasinya.', '可以用手机付吗？|Kěyǐ yòng shǒujī fù ma?|Boleh bayar pakai ponsel?'],
      dialog: ['A|师傅，您好！去国际会展中心。|Shīfu, nín hǎo! Qù Guójì Huìzhǎn Zhōngxīn.|Halo, Pak! Ke Pusat Konvensi Internasional.', 'B|好的。您赶时间吗？|Hǎo de. Nín gǎn shíjiān ma?|Baik. Anda buru-buru?', 'A|有点儿，我十点有个会。大概要多长时间？|Yǒudiǎnr, wǒ shí diǎn yǒu ge huì. Dàgài yào duō cháng shíjiān?|Agak, jam sepuluh saya ada rapat. Kira-kira berapa lama?', 'B|现在不堵车，二十分钟左右。|Xiànzài bù dǔchē, èrshí fēnzhōng zuǒyòu.|Sekarang tidak macet, sekitar dua puluh menit.', 'A|太好了。师傅，空调可以开大一点儿吗？|Tài hǎo le. Shīfu, kōngtiáo kěyǐ kāi dà yìdiǎnr ma?|Bagus. Pak, AC-nya bisa dikencangkan sedikit?', 'B|没问题。到了，在门口停可以吗？|Méi wèntí. Dào le, zài ménkǒu tíng kěyǐ ma?|Tidak masalah. Sudah sampai, berhenti di depan pintu boleh?', 'A|可以。多少钱？可以扫码吗？|Kěyǐ. Duōshao qián? Kěyǐ sǎo mǎ ma?|Boleh. Berapa? Bisa pindai kode?', 'B|三十八块，扫这个就行。慢走！|Sānshíbā kuài, sǎo zhège jiù xíng. Màn zǒu!|38 yuan, pindai ini saja. Hati-hati!'],
      resp: ['您去哪儿？|Nín qù nǎr?|Anda mau ke mana?|去火车站。:Qù huǒchēzhàn.|我在火车站。:Wǒ zài huǒchēzhàn.|火车很快。:Huǒchē hěn kuài.|Ke stasiun kereta.', '在哪儿停？|Zài nǎr tíng?|Berhenti di mana?|前面路口停一下。:Qiánmiàn lùkǒu tíng yíxià.|我不停。:Wǒ bù tíng.|停了三天。:Tíng le sān tiān.|Berhenti di perempatan depan.', '大概要多长时间？|Dàgài yào duō cháng shíjiān?|Kira-kira berapa lama?|半个小时左右。:Bàn ge xiǎoshí zuǒyòu.|三十块左右。:Sānshí kuài zuǒyòu.|在左边。:Zài zuǒbian.|Sekitar setengah jam.', '你的车牌号是多少？|Nǐ de chēpái hào shì duōshao?|Nomor pelat mobilmu berapa?|京A一二三四五，白色的车。:Jīng A yī èr sān sì wǔ, báisè de chē.|我没有车。:Wǒ méiyǒu chē.|我坐车。:Wǒ zuò chē.|Jing A12345, mobil putih.'] },
    { id: 'k-t6', type: 'topic', cat: 'travel', title: 'Bandara & Imigrasi', zh: '机场 · jīchǎng',
      phrases: ['请出示护照和登机牌。|Qǐng chūshì hùzhào hé dēngjīpái.|Tolong tunjukkan paspor dan boarding pass.', '你来中国做什么？|Nǐ lái Zhōngguó zuò shénme?|Untuk apa kamu datang ke Tiongkok?', '我来旅游。|Wǒ lái lǚyóu.|Saya datang untuk berwisata.', '我来出差，开会。|Wǒ lái chūchāi, kāihuì.|Saya datang untuk dinas, rapat.', '你打算待多久？|Nǐ dǎsuan dāi duō jiǔ?|Rencana tinggal berapa lama?', '我待一个星期。|Wǒ dāi yí ge xīngqī.|Saya tinggal satu minggu.', '你住在哪儿？|Nǐ zhù zài nǎr?|Kamu menginap di mana?', '我要托运一个箱子。|Wǒ yào tuōyùn yí ge xiāngzi.|Saya mau bagasikan satu koper.', '我要靠窗的座位。|Wǒ yào kào chuāng de zuòwèi.|Saya mau kursi dekat jendela.', '几号登机口？|Jǐ hào dēngjīkǒu?|Gerbang nomor berapa?', '航班延误了。|Hángbān yánwù le.|Penerbangan ditunda.', '行李在哪儿取？|Xíngli zài nǎr qǔ?|Ambil bagasi di mana?'],
      dialog: ['A|您好，请出示您的护照。|Nín hǎo, qǐng chūshì nín de hùzhào.|Halo, silakan tunjukkan paspor Anda.', 'B|给您。|Gěi nín.|Ini.', 'A|你来中国做什么？|Nǐ lái Zhōngguó zuò shénme?|Untuk apa Anda datang ke Tiongkok?', 'B|我来出差，参加一个展览会。|Wǒ lái chūchāi, cānjiā yí ge zhǎnlǎnhuì.|Saya dinas, menghadiri sebuah pameran.', 'A|打算待多久？住在哪儿？|Dǎsuan dāi duō jiǔ? Zhù zài nǎr?|Rencana berapa lama? Menginap di mana?', 'B|五天，住在广州的花园酒店。这是酒店的预订单。|Wǔ tiān, zhù zài Guǎngzhōu de Huāyuán Jiǔdiàn. Zhè shì jiǔdiàn de yùdìngdān.|Lima hari, menginap di Garden Hotel Guangzhou. Ini bukti pemesanan hotelnya.', 'A|好的，请看一下摄像头。可以了，欢迎来中国！|Hǎo de, qǐng kàn yíxià shèxiàngtóu. Kěyǐ le, huānyíng lái Zhōngguó!|Baik, silakan lihat ke kamera. Sudah, selamat datang di Tiongkok!', 'B|谢谢！请问，行李在哪儿取？|Xièxie! Qǐngwèn, xíngli zài nǎr qǔ?|Terima kasih! Permisi, ambil bagasi di mana?'],
      resp: ['你来中国做什么？|Nǐ lái Zhōngguó zuò shénme?|Untuk apa datang ke Tiongkok?|我来旅游。:Wǒ lái lǚyóu.|我来自印尼。:Wǒ láizì Yìnní.|我坐飞机。:Wǒ zuò fēijī.|Saya datang untuk berwisata.', '你打算待多久？|Nǐ dǎsuan dāi duō jiǔ?|Rencana tinggal berapa lama?|十天。:Shí tiān.|十点。:Shí diǎn.|十号登机口。:Shí hào dēngjīkǒu.|Sepuluh hari.', '你要靠窗还是靠过道的座位？|Nǐ yào kào chuāng háishi kào guòdào de zuòwèi?|Mau kursi jendela atau lorong?|靠窗的，谢谢。:Kào chuāng de, xièxie.|我要托运。:Wǒ yào tuōyùn.|航班延误了。:Hángbān yánwù le.|Jendela, terima kasih.', '有要托运的行李吗？|Yǒu yào tuōyùn de xíngli ma?|Ada bagasi yang mau didaftarkan?|有一个箱子。:Yǒu yí ge xiāngzi.|有一个护照。:Yǒu yí ge hùzhào.|在三号门。:Zài sān hào mén.|Ada satu koper.'] },
    { id: 'k-t7', type: 'topic', cat: 'daily', title: 'Minta Tolong & Keadaan Darurat', zh: '求助 · qiúzhù',
      phrases: ['救命！|Jiùmìng!|Tolong! (darurat)', '请帮帮我！|Qǐng bāngbang wǒ!|Tolong bantu saya!', '我的钱包丢了。|Wǒ de qiánbāo diū le.|Dompet saya hilang.', '我的手机被偷了。|Wǒ de shǒujī bèi tōu le.|Ponsel saya dicuri.', '请帮我报警。|Qǐng bāng wǒ bàojǐng.|Tolong laporkan ke polisi.', '派出所在哪儿？|Pàichūsuǒ zài nǎr?|Kantor polisi di mana?', '我需要看医生。|Wǒ xūyào kàn yīshēng.|Saya perlu ke dokter.', '快叫救护车！|Kuài jiào jiùhùchē!|Cepat panggil ambulans!', '报警电话是一一〇。|Bàojǐng diànhuà shì yāo yāo líng.|Nomor telepon polisi adalah 110.', '急救电话是一二〇。|Jíjiù diànhuà shì yāo èr líng.|Nomor darurat medis adalah 120.', '印尼大使馆的电话是多少？|Yìnní dàshǐguǎn de diànhuà shì duōshao?|Nomor telepon Kedutaan Indonesia berapa?', '你能借我手机打个电话吗？|Nǐ néng jiè wǒ shǒujī dǎ ge diànhuà ma?|Boleh pinjam ponsel untuk menelepon?'],
      dialog: ['A|警察同志，我的钱包丢了！|Jǐngchá tóngzhì, wǒ de qiánbāo diū le!|Pak Polisi, dompet saya hilang!', 'B|别着急，慢慢说。在哪儿丢的？|Bié zháojí, mànmàn shuō. Zài nǎr diū de?|Jangan panik, ceritakan pelan-pelan. Hilang di mana?', 'A|可能是在地铁上，大概一个小时以前。|Kěnéng shì zài dìtiě shang, dàgài yí ge xiǎoshí yǐqián.|Mungkin di MRT, kira-kira satu jam lalu.', 'B|钱包里有什么？|Qiánbāo li yǒu shénme?|Isi dompetnya apa?', 'A|有护照、银行卡和两千块现金。|Yǒu hùzhào, yínhángkǎ hé liǎngqiān kuài xiànjīn.|Paspor, kartu bank, dan uang tunai 2.000 yuan.', 'B|请填一下这张表，留下你的电话。我们会联系地铁公司。|Qǐng tián yíxià zhè zhāng biǎo, liú xia nǐ de diànhuà. Wǒmen huì liánxì dìtiě gōngsī.|Silakan isi formulir ini dan tinggalkan nomor telepon. Kami akan menghubungi operator MRT.', 'A|护照丢了怎么办？|Hùzhào diū le zěnme bàn?|Kalau paspor hilang bagaimana?', 'B|你需要去印尼大使馆补办。我们可以给你开一个证明。|Nǐ xūyào qù Yìnní dàshǐguǎn bǔbàn. Wǒmen kěyǐ gěi nǐ kāi yí ge zhèngmíng.|Kamu perlu mengurus penggantinya di Kedutaan Indonesia. Kami bisa buatkan surat keterangan.'],
      resp: ['你怎么了？|Nǐ zěnme le?|Kamu kenapa?|我的手机被偷了！:Wǒ de shǒujī bèi tōu le!|我很好吃。:Wǒ hěn hǎochī.|我是印尼人。:Wǒ shì Yìnní rén.|Ponsel saya dicuri!', '在哪儿丢的？|Zài nǎr diū de?|Hilang di mana?|在出租车上。:Zài chūzūchē shang.|昨天丢的。:Zuótiān diū de.|丢了一个钱包。:Diū le yí ge qiánbāo.|Di taksi.', '需要帮忙吗？|Xūyào bāngmáng ma?|Perlu bantuan?|需要，请帮我叫救护车！:Xūyào, qǐng bāng wǒ jiào jiùhùchē!|不客气。:Bú kèqi.|我不忙。:Wǒ bù máng.|Perlu, tolong panggilkan ambulans!', '护照丢了怎么办？|Hùzhào diū le zěnme bàn?|Kalau paspor hilang bagaimana?|去大使馆补办。:Qù dàshǐguǎn bǔbàn.|去商店买。:Qù shāngdiàn mǎi.|去饭店吃饭。:Qù fàndiàn chī fàn.|Urus penggantinya di kedutaan.'] },
    { id: 'k-t8', type: 'topic', cat: 'daily', title: 'Telepon & WeChat', zh: '打电话和微信 · dǎ diànhuà hé Wēixìn',

      dialog: ['A|喂，你好！请问是张经理吗？|Wéi, nǐ hǎo! Qǐngwèn shì Zhāng jīnglǐ ma?|Halo! Maaf, apakah ini Manajer Zhang?', 'B|是我。请问哪位？|Shì wǒ. Qǐngwèn nǎ wèi?|Ya, saya. Dengan siapa ini?', 'A|我是印尼公司的安迪。您现在方便说话吗？|Wǒ shì Yìnní gōngsī de Āndí. Nín xiànzài fāngbiàn shuōhuà ma?|Saya Andi dari perusahaan Indonesia. Bapak sekarang bisa bicara?', 'B|不好意思，我在开车。十分钟以后给你回电话，好吗？|Bù hǎoyìsi, wǒ zài kāichē. Shí fēnzhōng yǐhòu gěi nǐ huí diànhuà, hǎo ma?|Maaf, saya sedang menyetir. Sepuluh menit lagi saya telepon balik, ya?', 'A|好的。我先把报价单发到您的微信上。|Hǎo de. Wǒ xiān bǎ bàojiàdān fā dào nín de Wēixìn shang.|Baik. Saya kirim dulu daftar harga ke WeChat Bapak.', 'B|好，收到以后我看一下。|Hǎo, shōu dào yǐhòu wǒ kàn yíxià.|Oke, setelah diterima saya lihat.', 'A|谢谢张经理，那先这样。|Xièxie Zhāng jīnglǐ, nà xiān zhèyàng.|Terima kasih, Pak Zhang, sudah dulu ya.', 'B|好，回头聊，拜拜！|Hǎo, huítóu liáo, bàibai!|Oke, nanti ngobrol lagi, dah!'],

  LS.set(cacheKey() + '.items', JSON.stringify([...S.items.values()]));
  LS.set(cacheKey() + '.seq', String(S.seq));
  if (!S.admin) LS.set(cacheKey() + '.queue', JSON.stringify([...S.queue]));
}
function loadCache() {
  S.items = new Map(); S.queue = new Set(); S.seq = 0;
  try { for (const it of JSON.parse(LS.get(cacheKey() + '.items') || '[]')) S.items.set(key(it), it); } catch {}
  S.seq = Number(LS.get(cacheKey() + '.seq') || 0);
  if (!S.admin) try { S.queue = new Set(JSON.parse(LS.get(cacheKey() + '.queue') || '[]')); } catch {}
  if (S.admin) try { S.users = JSON.parse(LS.get('admin.users') || '[]'); } catch {}
}

// ---------- progress model ----------
// prog item 'u_<unit>' {best, last, tries, done, at}; meta 'vocab-mem' {m:{hanzi: box 0..5}}; meta 'stats-xp' {xp, days:{ymd: xp}}
const live = (o, id) => { const it = S.items.get(o + '/' + id); return it && !it.deleted ? it : null; };
const prog = (uid, o = who()) => live(o, 'u_' + uid)?.data || null;
const best = (uid, o) => prog(uid, o)?.best || 0;
const mem = (o = who()) => live(o, 'vocab-mem')?.data?.m || {};
const stats = (o = who()) => live(o, 'stats-xp')?.data || { xp: 0, days: {} };
const PASS = 70, MASTER = 3;
function mastered(o, lid) { const m = mem(o); return WORDS.filter(w => (!lid || w.level === lid) && (m[w.k] || 0) >= MASTER).length; }
function levelPct(lid, o = who()) {
  const us = UNITS.filter(u => u.level === lid), ws = WORDS.filter(w => w.level === lid), up = us.reduce((a, u) => a + best(u.id, o), 0) / us.length;
  return Math.round(ws.length ? up * 0.8 + mastered(o, lid) / ws.length * 100 * 0.2 : up);
}
function overall(o = who()) { return Math.round(UNITS.reduce((a, u) => a + best(u.id, o), 0) / UNITS.length * 0.8 + mastered(o) / WORDS.length * 100 * 0.2); }
const doneCount = (lid, o = who()) => UNITS.filter(u => (!lid || u.level === lid) && prog(u.id, o)?.done).length;
const RANKS = [[0, 'Pemula'], [12, 'Dasar'], [35, 'Menengah'], [62, 'Mahir'], [88, 'Ahli']];
const rank = p => [...RANKS].reverse().find(r => p >= r[0]);
// a level opens when the previous one reaches 60%, or once the learner has started it (new units must not lock anyone out)
const prevLevel = L => { const i = COURSE.indexOf(L); for (let j = i - 1; j >= 0; j--) if (!COURSE[j].free) return COURSE[j]; return null; };
const unlocked = lid => { const L = LEVEL(lid), pv = prevLevel(L); return !pv || L.free || S.admin || LS.get('unlock') === '1' || levelPct(pv.id) >= 60 || UNITS.some(u => u.level === lid && prog(u.id)); };
function streak(o = who()) {
  const days = stats(o).days || {}; let n = 0; const d = new Date();
  if (!days[ymd(d)]) d.setDate(d.getDate() - 1);
  while (days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function nextUnit() { // first unit not passed yet, in order, in an unlocked (non-side) level
  for (const L of COURSE) { if (L.free) continue; if (!unlocked(L.id)) break; const u = L.units.find(u => !prog(u.id)?.done); if (u) return u; }
  return null;
}

function put(it, quiet) { // local write → queue → push
  if (RO()) return;
  const prev = S.items.get(key(it));
  it.updated = Math.max(Date.now(), (prev?.updated || 0) + 1);
  S.items.set(key(it), it); S.queue.add(key(it)); saveCache(); if (!quiet) render(); pushSoon();
}
function setProg(uid, score) {
  if (RO()) return false;
  const d = prog(uid, S.user) || {}, first = !d.done && score >= PASS;
  put({ id: 'u_' + uid, owner: S.user, kind: 'prog', deleted: false, data: { best: Math.max(d.best || 0, score), last: score, tries: (d.tries || 0) + 1, done: !!d.done || score >= PASS, at: Date.now() } }, true);
  return first;
}
function bumpWord(k, delta) {
  if (RO() || !k) return;
  const m = { ...mem(S.user) }; m[k] = clamp((m[k] || 0) + delta, 0, 5);
  put({ id: 'vocab-mem', owner: S.user, kind: 'meta', deleted: false, data: { m } }, true);
}
function addXp(n) {
  if (RO() || !n) return;
  const s = stats(S.user), days = { ...(s.days || {}) }, t = ymd(new Date());
  days[t] = (days[t] || 0) + n;
  for (const k of Object.keys(days)) if (k < ymd(new Date(Date.now() - 120 * 864e5))) delete days[k];
  put({ id: 'stats-xp', owner: S.user, kind: 'meta', deleted: false, data: { xp: (s.xp || 0) + n, days } }, true);
}

// ---------- server ----------
async function rpc(fn, args) { // retries: some networks drop connections
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
      if (!r.ok) { const e = new Error('server ' + r.status); e.server = true; throw e; }
      const t = await r.text(); return t ? JSON.parse(t) : null;
    } catch (e) { if (i >= 4 || e.server) throw navigator.onLine ? e : new Error('offline'); await new Promise(r => setTimeout(r, 300 * (i + 1))); }
  }
}
let pushTimer = null;
function pushSoon() { clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 400); showSync(); }
async function syncNow() {
  if (!S.user && !S.admin) return;
  if (S.sync.busy) { S.sync.again = true; return; }
  S.sync.busy = true; showSync(); let changed = false; const me = cacheKey();
  try {
    if (!S.admin && S.queue.size) {
      const keys = [...S.queue], sent = keys.map(k => S.items.get(k)).filter(Boolean);
      const snap = new Map(sent.map(i => [key(i), i.updated]));
      for (let i = 0; i < sent.length; i += 200) {
        const b = sent.slice(i, i + 200).map(({ id, kind, data, updated, deleted }) => ({ id, kind, data, updated, deleted }));
        const r = await rpc('zh_put', { p_owner: S.user, p_pin: S.pin || null, p_items: b });
        if (!r?.ok) { needPin(r?.pin); return; }
      }
      for (const k of keys) if (S.items.get(k)?.updated === snap.get(k)) S.queue.delete(k);
      saveCache(); ping();
    }
    let rows;
    if (S.admin) {
      const r = await rpc('zh_admin', { p_pass: S.pass, p_after: S.seq });
      if (!r?.ok) { logout(); return; }
      S.users = r.users || []; LS.set('admin.users', JSON.stringify(S.users)); rows = r.rows || [];
    } else { const r = await rpc('zh_list', { p_owner: S.user, p_after: S.seq, p_pin: S.pin || null }); if (!r?.ok) { needPin(r?.pin); return; } rows = r.rows || []; }
    if (me !== cacheKey()) return;
    for (const r of rows) {
      const it = { id: r.id, owner: r.owner || S.user, kind: r.kind, data: r.data || {}, updated: Number(r.updated), deleted: !!r.deleted };
      const cur = S.items.get(key(it));
      if (!cur || (it.updated >= cur.updated && !S.queue.has(key(it)))) {
        if (!cur || JSON.stringify(cur) !== JSON.stringify(it)) changed = true;
        S.items.set(key(it), it);
      }
      S.seq = Math.max(S.seq, Number(r.seq));
    }
    if (changed || rows.length) saveCache();
    S.sync.at = new Date(); S.sync.err = '';
  } catch (e) { S.sync.err = e?.message === 'offline' ? 'Offline, tersimpan di perangkat ini' : (e?.message || String(e)); }
  finally { S.sync.busy = false; }
  if (S.sync.again) { S.sync.again = false; return syncNow(); }
  if (changed && !S.run) render(); else showSync();
}
// realtime: supabase broadcast pings (no data inside), plus a 10 s check
let sb = null, chans = [];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Gagal memuat ' + src.split('/').pop())); document.head.appendChild(s); });
async function liveStart() {
  try {
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    sb ||= window.supabase.createClient(SB_URL, SB_KEY);
    liveStop();
    const all = sb.channel('mandarin-all');
    if (S.admin) all.on('broadcast', { event: 'chg' }, () => syncNow());
    chans.push(all.subscribe());
    if (!S.admin) chans.push(sb.channel('mandarin-u-' + S.user).on('broadcast', { event: 'chg' }, () => syncNow()).subscribe());
  } catch {}
}
function liveStop() { if (sb) chans.forEach(c => sb.removeChannel(c)); chans = []; }
function ping() { for (const c of chans) try { c.send({ type: 'broadcast', event: 'chg', payload: { t: Date.now() } }); } catch {} }
const syncText = () => S.sync.err ? S.sync.err : S.sync.busy || S.queue.size ? 'Menyimpan…' : S.sync.at ? 'Tersinkron ' + hms(S.sync.at) : 'Menghubungkan…';
function showSync() { document.querySelectorAll('.sync').forEach(e => { e.textContent = syncText(); e.classList.toggle('err', !!S.sync.err); }); }

// ---------- login (same accounts & PIN as Planner / Notes / English) ----------
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
const pinHash = (name, pin) => sha('planner-pin:' + name + ':' + pin);
const PIN_MSG = { need: 'Masukkan PIN.', wrong: 'PIN salah.', locked: 'Terlalu banyak PIN salah. Coba lagi 15 menit lagi.', format: 'PIN harus 4–12 angka.', invalid: 'Nama pengguna tidak valid.' };
function needPin(code) { // server says this session's PIN is missing/wrong: back to the PIN screen
  const name = S.user; if (!name) return;
  liveStop(); LS.set('u.' + name + '.haspin', '1'); SS.del('pin.' + name);
  S.user = null; S.pin = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.run = null;
  S.gate = { name, msg: code === 'locked' ? PIN_MSG.locked : 'Akun ini memakai PIN. Masukkan PIN untuk melanjutkan.' };
  if (dlg().open) dlg().close(); render();
}
async function login(raw, pass, remember, pin) {
  const name = normUser(raw);
  if (!validUser(name)) throw new Error('Nama pengguna 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda minus.');
  if (name === ADMIN) {
    if (!pass) throw new Error('Masukkan password Admin.');
    const r = await rpc('zh_admin', { p_pass: pass, p_after: 0 }).catch(e => { throw new Error('Tidak bisa menghubungi server (' + e.message + ').'); });
    if (!r?.ok) throw new Error(r?.locked ? 'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.' : 'Password Admin salah.');
    S.admin = true; S.user = null; S.pass = pass; S.owner = '';
    S.items = new Map(); S.seq = 0; S.users = r.users || [];
    for (const x of r.rows || []) { const it = { id: x.id, owner: x.owner, kind: x.kind, data: x.data || {}, updated: Number(x.updated), deleted: !!x.deleted }; S.items.set(key(it), it); S.seq = Math.max(S.seq, Number(x.seq)); }
    saveCache(); LS.set('admin.users', JSON.stringify(S.users)); S.sync.at = new Date();
    SS.set('admin', pass); if (remember) LS.set('session', JSON.stringify({ admin: true })); else LS.del('session');
    go('users');
  } else {
    let r = null;
    try { r = await rpc('pl_login', { p_owner: name, p_pin: pin || null }); } catch (e) { // offline: unlock with the PIN checked on this device before
      const h = LS.get('u.' + name + '.pinhash');
      if (h) { if (!pin) { const er = new Error(PIN_MSG.need); er.needPin = true; throw er; } if (await pinHash(name, pin) !== h) throw new Error(PIN_MSG.wrong); }
      else if (LS.get('u.' + name + '.haspin')) throw new Error('Tidak bisa menghubungi server (' + e.message + ').');
    }
    if (r && !r.ok) { const er = new Error(PIN_MSG[r.pin] || 'Gagal masuk.'); er.needPin = r.pin === 'need'; throw er; }
    S.admin = false; S.user = name; S.pass = ''; S.pin = pin || ''; S.gate = null;
    if (r) { S.hasPin = !!r.pin; if (r.pin) { LS.set('u.' + name + '.haspin', '1'); LS.set('u.' + name + '.pinhash', await pinHash(name, pin)); } else { LS.del('u.' + name + '.haspin'); LS.del('u.' + name + '.pinhash'); } }
    else S.hasPin = !!pin;
    if (pin) SS.set('pin.' + name, pin);
    loadCache();
    if (remember) LS.set('session', JSON.stringify({ user: name })); else { LS.del('session'); SS.set('user', name); }
    setTimeout(syncNow, 0);
    if (route()[0] === 'users') go('');
  }
  liveStart();
}
function logout() {
  liveStop(); LS.del('session'); SS.del('admin'); SS.del('user'); if (S.user) SS.del('pin.' + S.user); S.pin = ''; S.gate = null; S.run = null;
  S.user = null; S.admin = false; S.pass = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.sync = { busy: false, again: false, at: null, err: '' };
  if (dlg().open) dlg().close(); go('');
}

// ---------- speech (Mandarin voice) ----------
let VOICE = null;
function zhVoice() {
  if (VOICE) return VOICE;
  const vs = (window.speechSynthesis?.getVoices() || []).filter(v => /^(zh|cmn)[-_](CN|Hans)/i.test(v.lang) || /^zh$/i.test(v.lang));
  VOICE = vs.find(v => /Tingting|Ting-Ting|Xiaoxiao|Yunxi|Google 普通话|Lili|Meijia/i.test(v.name) && /CN/i.test(v.lang)) || vs.find(v => /CN/i.test(v.lang)) || vs[0] || null;
  return VOICE;
}
const rate = slow => slow || LS.get('slow') === '1' ? 0.6 : 0.85;
function say(t, slow) {
  try {
    const sy = window.speechSynthesis; if (!sy || !t) return; sy.cancel();
    const u = new SpeechSynthesisUtterance(String(t).replace(/_{3,}/g, '什么')); u.lang = 'zh-CN';
    u.rate = rate(slow); const v = zhVoice(); if (v) u.voice = v; sy.speak(u);
  } catch {}
}
try { speechSynthesis.onvoiceschanged = () => { VOICE = null; }; } catch {}
const autoSay = () => LS.get('autosay') !== '0';
const spk = (t, cls = '') => `<button type="button" class="spk ${cls}" data-a="say" data-t="${esc(t)}" aria-label="Dengarkan" title="Dengarkan">${ic('speaker', cls === 'xl' ? 28 : cls === 'sm' ? 14 : 16)}</button>`;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// hanzi with pinyin: word = pinyin above (ruby), sentence = hanzi line + pinyin line
const zw = (hz, py, cls = '') => `<span class="zw ${cls}"><span class="py">${esc(py)}</span><span class="hz" lang="zh-CN">${esc(hz)}</span></span>`;
const zs = (hz, py) => `<span class="zs"><span class="hz" lang="zh-CN">${esc(hz)}</span>${py ? `<span class="py">${esc(py)}</span>` : ''}</span>`;
const optHtml = o => { const [h, p] = String(o).split('\t'); return p !== undefined ? (HZRE.test(h) ? zw(h, p) : esc(h)) : HZRE.test(h) ? `<span class="hz" lang="zh-CN">${esc(h)}</span>` : esc(h); };
const plain = o => String(o).split('\t').filter(Boolean).join(' · ');

      ${tb('tabs')}

}

  lvl: el => { S.lvl = el.dataset.v; LS.set('lvl', S.lvl); S.cat = ''; S.type = 'all'; if (route()[0] !== 'learn') go('learn'); else render(); },
  type: el => { S.type = el.dataset.v; S.cat = ''; render(); },
  cat: el => { S.cat = S.cat === el.dataset.v && route()[0] === 'learn' ? '' : el.dataset.v; S.type = 'all'; if (S.cat && !UNITS.some(u => u.level === S.lvl && u.cat === S.cat)) S.lvl = (COURSE.find(l => unlocked(l.id) && l.units.some(u => u.cat === S.cat)) || COURSE[0]).id; if (route()[0] !== 'learn') go('learn'); else render(); },
  src: el => { S.src = el.dataset.v; LS.set('src', S.src); render(); },
  unlock: () => { LS.set('unlock', '1'); render(); toast('Semua level terbuka.'); },
  seeuser: el => { S.owner = el.dataset.v; go('prog'); },
  quiz: el => { const u = UMAP.get(el.dataset.v); startQuiz(u.title, unitQs(u), u.id); },
  flashunit: el => { const u = UMAP.get(el.dataset.v); startFlash(shuffle(u.W), 'Kartu Hafalan · ' + u.title, u.id); },
  game: el => startGame(el.dataset.v),
  pdf: async el => {
    if (el.dataset.busy) return; el.dataset.busy = '1'; el.classList.add('busy'); toast('Menyiapkan PDF…', 0);
    try { await makePdf(el.dataset.k, el.dataset.v); toast('PDF siap diunduh.'); }
    catch (e) { toast('PDF gagal dibuat: ' + (e?.message || e), 4000); }
    finally { delete el.dataset.busy; el.classList.remove('busy'); }
  },
  quit: () => { const R = S.run; S.run = null; clearInterval(tickT); try { R?.recog?.abort(); } catch {} window.speechSynthesis?.cancel(); render(); window.scrollTo(0, 0); },
  playdlg: el => { // reads the dialog line by line, highlighting each bubble
    const u = UMAP.get(el.dataset.v), sy = window.speechSynthesis; if (!sy) return; sy.cancel();
    u.DL.forEach((d, i) => { const ut = new SpeechSynthesisUtterance(d.hz); ut.lang = 'zh-CN'; ut.rate = rate(); const v = zhVoice(); if (v) ut.voice = v; if (d.sp !== 'A') ut.pitch = 0.8;
      ut.onstart = () => { document.querySelectorAll('.bub.on').forEach(b => b.classList.remove('on')); const b = $('#dl-' + i); if (b) { b.classList.add('on'); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } };
      ut.onend = () => { if (i === u.DL.length - 1) $('#dl-' + i)?.classList.remove('on'); }; sy.speak(ut); });
  },
  ans: el => { const R = S.run, q = R.qs[R.i]; if (R.ans !== null) return; R.ans = Number(el.dataset.v); answer(q.opts[R.ans] === q.a, q); render(); $('#next-btn')?.focus(); },
  tok: el => { const q = S.run.qs[S.run.i]; q.sel.push(Number(el.dataset.v)); say(q.toks[Number(el.dataset.v)].t); render(); },
  untok: el => { const q = S.run.qs[S.run.i]; q.sel.splice(Number(el.dataset.v), 1); render(); },
  scrcheck: () => { const R = S.run, q = R.qs[R.i]; const got = q.sel.map(i => q.toks[i].t).join(''); R.ans = got === q.a.replace(PUNCT, ''); answer(R.ans, q); render(); $('#next-btn')?.focus(); },
  next: () => { const R = S.run; R.i++; R.ans = null; R.typed = ''; if (R.i >= R.qs.length) finishQuiz(); render(); window.scrollTo(0, 0); speakQ(); setTimeout(() => $('#type-in')?.focus(), 30); },
  flip: () => { S.run.flip = !S.run.flip; render(); if (S.run.flip && autoSay()) say(S.run.deck[S.run.i].ex); },
  fknow: () => flashNext(true), fagain: () => flashNext(false),
  spans: el => { const R = S.run, q = R.q, ok = q.opts[Number(el.dataset.v)] === q.a; R.total++; if (ok) R.right++; bumpWord(q.word, ok ? 1 : 0); R.flash = ok ? 'flash-ok' : 'flash-bad'; if (!ok) toast(`Jawaban: ${plain(q.a)}`); nextSpeed(); render(); },
  matchnext: () => { newMatch(); render(); },
  mpick: el => {
    const R = S.run, m = R.m, side = el.dataset.v[0], k = el.dataset.v.slice(1); m.bad = null;
    if (side === 'L') { m.selL = k; say(k); } else m.selR = k;
    if (m.selL && m.selR) {
      const wl = m.left.find(w => w.k === m.selL), wr = m.right.find(w => w.k === m.selR);
      if (wl.k === wr.k || wl.id === wr.id) { m.done.add(wl.k); if (wr.k !== wl.k) m.done.add(wr.k); bumpWord(wl.k, 1); addXp(1); }
      else { m.miss++; m.bad = ['L' + m.selL, 'R' + m.selR]; setTimeout(() => { if (S.run?.m === m) { m.bad = null; render(); } }, 600); }
      m.selL = m.selR = null;
      if (m.done.size === m.left.length) addXp(5);
    }
    render();
  },
  rec: () => {
    const R = S.run; if (!SR || R.rec) return; window.speechSynthesis?.cancel();
    const r = new SR(); r.lang = 'zh-CN'; r.interimResults = false; r.maxAlternatives = 3; R.recog = r; R.rec = true; R.err = ''; render();
    r.onresult = ev => { const e = R.list[R.i], alts = [...ev.results[0]].map(a => a.transcript); let bestA = alts[0], sc = 0; for (const a of alts) { const s = similarity(e.hz, a); if (s > sc) { sc = s; bestA = a; } } R.heard = bestA; const was = R.res?.ok; R.res = { score: sc, ok: sc >= 70 }; if (R.res.ok && !was) { R.right++; addXp(3); } };
    r.onerror = ev => { R.err = ev.error === 'not-allowed' ? 'Izinkan akses mikrofon untuk latihan ini.' : ev.error === 'no-speech' ? 'Suara tidak terdengar. Coba lagi lebih dekat ke mikrofon.' : 'Pengenalan suara gagal (' + ev.error + ').'; };
    r.onend = () => { R.rec = false; if (S.run === R) render(); };
    try { r.start(); } catch { R.rec = false; render(); }
  },
  speaknext: () => { const R = S.run; R.i++; R.res = null; R.heard = ''; R.err = ''; render(); },
  pinsave: () => {
    const old = $('#pin-old')?.value || '', a = $('#pin-new').value, b = $('#pin-new2').value, out = $('#pin-msg');
    if (!/^\d{4,12}$/.test(a)) { out.textContent = PIN_MSG.format; return; }
    if (a !== b) { out.textContent = 'PIN baru tidak sama.'; return; }
    if (S.hasPin && !old) { out.textContent = 'Masukkan PIN saat ini.'; return; }
    pinChange(old, a, out);
  },
  pinoff: () => { const old = $('#pin-old')?.value || '', out = $('#pin-msg'); if (!old) { out.textContent = 'Masukkan PIN saat ini untuk menghapus.'; return; } pinChange(old, '', out); },
  reset: el => { // two clicks: no confirm()/prompt() dialogs
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Klik sekali lagi untuk menghapus'; setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = 'Hapus semua progres'; } }, 4000); return; }
    for (const it of [...S.items.values()]) if (it.owner === S.user && !it.deleted) put({ ...it, data: {}, deleted: true }, true);
    dlg().close(); render(); toast('Progres dihapus. Mulai dari 0%.');
  }
};
function flashNext(ok) {
  const R = S.run, w = R.deck[R.i];
  bumpWord(w.k, ok ? 1 : -1); if (ok) { R.know++; addXp(1); } else if (R.deck.length < 40) R.deck.push(w); // again later in this session
  R.i++; R.flip = false;
  if (R.i >= R.deck.length && R.unit) addXp(5);
  render(); if (R.i < R.deck.length && autoSay()) say(R.deck[R.i].hz);
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || !A[el.dataset.a] || el.disabled) return;
  if (el.type !== 'checkbox') ev.preventDefault(); ev.stopPropagation(); A[el.dataset.a](el);
});
document.addEventListener('input', ev => { if (ev.target.id === 'user-in') syncMask(); });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'theme') { t.value === 'auto' ? LS.del('theme') : LS.set('theme', t.value); applyTheme(); }
  if (t.id === 'opt-py') setPy(t.checked);
  if (t.id === 'opt-autosay') t.checked ? LS.del('autosay') : LS.set('autosay', '0');
  if (t.id === 'opt-slow') t.checked ? LS.set('slow', '1') : LS.del('slow');
  if (t.id === 'opt-unlock') { t.checked ? LS.set('unlock', '1') : LS.del('unlock'); render(); }
});
document.addEventListener('keydown', ev => {
  const R = S.run; if (!R || dlg().open || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if (R.kind === 'quiz' && R.i < R.qs.length) {
    const q = R.qs[R.i];
    if (R.ans !== null && ev.key === 'Enter' && !typing) { ev.preventDefault(); A.next(); return; }
    if (q.t === 'mc' && R.ans === null && /^[1-4]$/.test(ev.key)) { const b = document.querySelectorAll('.opt')[Number(ev.key) - 1]; if (b) A.ans(b); }
  }
  if (R.kind === 'speed' && /^[1-4]$/.test(ev.key)) { const b = document.querySelectorAll('.opt')[Number(ev.key) - 1]; if (b) A.spans(b); }
  if (R.kind === 'flash' && !typing) { if (ev.key === ' ') { ev.preventDefault(); A.flip(); } else if (ev.key === 'ArrowRight') A.fknow(); else if (ev.key === 'ArrowLeft') A.fagain(); }
});
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'type-form') {
    const R = S.run, q = R.qs[R.i]; if (R.ans !== null) return;
    R.typed = $('#type-in').value; if (!R.typed.trim()) return;
    R.ans = typedOk(R.typed, q); answer(R.ans, q); render(); $('#next-btn')?.focus(); return;
  }
  if (f.id === 'gate-form') {
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Membuka…';
    const pinMode = !!S.gate, name = pinMode ? S.gate.name : $('#user-in').value, pin = pinMode ? $('#pin-in').value : '';
    if (pinMode && !pin) { btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = PIN_MSG.need; return; }
    login(name, pinMode ? '' : $('#pass-in').value, $('#remember').checked, pin).then(render, e => {
      if (e.needPin && !pinMode) { S.gate = { name: normUser(name), msg: '' }; render(); return; }
      btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = e.message; const pi = $('#pin-in'); if (pi) { pi.value = ''; pi.focus(); } });
  }
});
dlg().addEventListener('click', ev => { if (ev.target === dlg()) dlg().close(); }); // click on backdrop

// ---------- auto update + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build when not in the middle of an exercise
  if (dlg().open || S.queue.size || S.run) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1] + location.hash); }
  } catch {}
}
setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
setInterval(checkUpdate, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || 'null'); } catch {}
  const ssUser = SS.get('user'), ssAdmin = SS.get('admin');
  if (s?.admin || ssAdmin) {
    if (ssAdmin) { S.admin = true; S.pass = ssAdmin; loadCache(); render(); liveStart(); syncNow(); return; }
    LS.del('session'); // admin password is never stored on the device; ask again
  } else if (s?.user || ssUser) {
    const name = s?.user || ssUser, pin = SS.get('pin.' + name) || '';
    if (LS.get('u.' + name + '.haspin') && !pin) { S.gate = { name, msg: '' }; render(); return; } // PIN asked on every new visit
    S.user = name; S.pin = pin; S.hasPin = !!LS.get('u.' + name + '.haspin'); loadCache();
    render(); liveStart(); syncNow(); return;
  }
  render();
}
boot();
</script>
