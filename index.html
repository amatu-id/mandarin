<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>Mandarin Course</title>
<meta name="description" content="Mandarin Course: kursus bahasa Mandarin dari nol sampai ahli dengan terjemahan Indonesia. Pinyin dan nada, kosakata HSK 1–6, tata bahasa, percakapan sehari-hari, bacaan, latihan, dan modul PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#b42318">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23b42318'/><text x='50' y='70' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-weight='700' font-size='58' fill='white' text-anchor='middle'>中</text></svg>">
<style>:root{--bg:#f6f7f9;--card:#fff;--soft:#eef0f4;--line:#e3e6eb;--text:#151a23;--muted:#667085;--acc:#b42318;--acc-soft:#fbeceb;--acc-ink:#fff;--ok:#1b7f4b;--okbg:#e8f5ee;--red:#c2410c;--redbg:#fdf0e8;--shadow:0 1px 2px rgba(16,24,40,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101318;--card:#171b22;--soft:#20252e;--line:#2a303a;--text:#e9ecf1;--muted:#98a1b0;--acc:#f08a7e;--acc-soft:#33201e;--acc-ink:#1d0d0b;--ok:#5cc88f;--okbg:#14291e;--red:#f5a15c;--redbg:#33241a;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#101318;--card:#171b22;--soft:#20252e;--line:#2a303a;--text:#e9ecf1;--muted:#98a1b0;--acc:#f08a7e;--acc-soft:#33201e;--acc-ink:#1d0d0b;--ok:#5cc88f;--okbg:#14291e;--red:#f5a15c;--redbg:#33241a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:650;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
a{color:inherit}
.ic{flex:none;display:block}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 18px;font-size:15.5px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:6px;background:var(--acc-soft);color:var(--acc)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;text-decoration:none;flex:none}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:700}
.tabs{display:flex;gap:2px;flex:1;justify-content:center}
.tab{border:0;background:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;color:var(--muted);display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--acc);background:var(--acc-soft)}
.tabs .ti{display:none}
.bnav{display:none}
.top-r{display:flex;align-items:center;gap:12px;flex:none}
.pill{font-weight:650;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--acc-soft);color:var(--acc)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}.sync.err{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px 5px 11px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.main{max-width:1560px;margin:0 auto;padding:20px 24px 40px}
.viewing{margin-bottom:16px;padding:8px 12px;border-radius:8px;background:var(--acc-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h1,.hero h1,.u-t h1{margin:0;font-size:24px}
.sh{font-size:15px;margin:30px 0 12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
/* home */
.hero{display:flex;gap:28px;align-items:center;padding:24px 28px}
.hero-ring{flex:none}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero-t p{margin:0}
.next{display:flex;align-items:center;gap:16px;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.next>div{display:flex;flex-direction:column;min-width:0}.next b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.stat b{font-size:22px;font-weight:650;letter-spacing:-.02em}.stat b small{font-size:13px;color:var(--muted);font-weight:500}.stat span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lvl{text-align:left;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lvl:hover,.catb:hover,.gtile:hover:not(:disabled),.ucard:hover,.pdfb:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.lvl.locked{opacity:.6}
.lvl p{margin:8px 0 2px;color:var(--muted)}
.lvl-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.lvl-n{font-size:17px}
.lvl-p{margin-left:auto;font-weight:650;font-size:16px;color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.catb{display:flex;flex-direction:column;gap:2px;padding:12px 14px;cursor:pointer;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.games.mini{grid-template-columns:repeat(3,minmax(0,1fr))}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;cursor:pointer;text-align:left}
.gtile:disabled{opacity:.5;cursor:not-allowed}
.how ol{margin:0;padding:4px 22px 16px 40px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.how{margin-top:16px}.how summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
.how summary::-webkit-details-marker{display:none}.how summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0}
.how[open] summary::after{transform:rotate(-135deg);margin-top:4px}
/* home dashboard: everything on one screen — levels left, practice right */
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.dash .sh{margin:18px 0 10px}.dash-r>.sh:first-child{margin-top:0}
.dash .hero{padding:18px 22px;gap:22px}.dash .next{padding-top:10px;margin-top:2px}
.dash .stats{margin-top:12px}.dash .stat{padding:10px 14px}
.dash .lvl{padding:14px 16px}.dash .lvl p{margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dash .lvl .bar{margin:8px 0 4px}
.dash-r .cats{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-r .catb{padding:9px 12px}
.dash-r .games.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-r .gtile{padding:11px 13px}
.dash .grid2.lv3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dash .kilat{margin-top:12px;padding:12px 16px}.dash .kilat .k-t .bar{margin:4px 0 2px}
@media (max-width:1100px){.dash{grid-template-columns:1fr}.dash-r>.sh:first-child{margin-top:18px}.dash-r .cats,.dash-r .games.mini{grid-template-columns:repeat(3,minmax(0,1fr))}}
.how b{color:var(--text);font-weight:600}
/* learn */
.seg4{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg4 button{border:0;background:none;padding:9px 6px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg4 button.on{background:var(--card);box-shadow:0 1px 3px rgba(16,24,40,.08);color:var(--text)}
.seg4 small{font-weight:500;margin-left:4px}
.lvl-d{margin:12px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chipb{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 11px;font-size:13.5px;cursor:pointer;font-weight:550;color:var(--muted)}
.chipb.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.chipb:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.grid.dim{opacity:.55}
.ucard{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ucard.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.uc-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:550}
.uc-n{font-variant-numeric:tabular-nums;font-weight:650;color:var(--acc)}
.uc-title{font-size:15.5px;margin-top:4px;font-weight:600}
.ok{color:var(--ok);font-weight:650;margin-left:auto}
.lockbox{padding:14px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* unit */
.u-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:8px}
.u-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.u-s{display:flex;flex-direction:column;align-items:flex-end}.u-s b{font-size:22px;color:var(--acc)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:16px}
.word{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.w-h{display:flex;align-items:center;gap:8px}
.w-en{font-size:17px;font-weight:600}
.dots{margin-left:auto;display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.flash .dots{margin:0}
.w-id{font-weight:550;color:var(--acc)}
.w-ex{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.spk{border:0;background:var(--acc-soft);color:var(--acc);border-radius:50%;width:30px;height:30px;flex:none;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.spk:hover{filter:brightness(.96)}
.spk.sm{width:24px;height:24px}
.spk.xl{width:64px;height:64px}
.prose{padding:6px 22px 14px;line-height:1.7;text-align:justify;hyphens:auto}
.prose ul{padding-left:20px}.prose li{margin:3px 0}
.prose .tip{background:var(--soft);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 8px 8px 0}
.prose .gt{border-collapse:collapse;width:100%;max-width:560px}
.prose .gt th,.prose .gt td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.prose .gt th{background:var(--soft)}
.reading{padding-top:14px}.reading p{margin:0 0 14px}
.trn{display:block;color:var(--muted);font-style:italic;margin-top:4px;font-size:14px}
.gloss{padding:6px 0;display:grid;grid-template-columns:1fr 1fr}
.gloss>div{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.gloss>div:nth-child(-n+2){border-top:0}
.gloss .muted{margin-left:auto;text-align:right}
.pat{padding:12px;display:flex;flex-direction:column;gap:8px}
.pat code{background:var(--soft);padding:8px 12px;border-radius:6px;font:500 14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:normal}
.list{padding:4px 0}
.list .row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.two-col{display:grid;grid-template-columns:1fr 1fr}
.two-col .row:nth-child(2){border-top:0}
.dlgbox{padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{display:flex;gap:8px;max-width:80%;align-items:flex-start}
.bub>div{background:var(--soft);padding:9px 12px;border-radius:10px;transition:box-shadow .2s}
.bub.r{align-self:flex-end;flex-direction:row-reverse}
.bub.r>div{background:var(--acc-soft)}
.bub.on>div{box-shadow:0 0 0 2px var(--acc)}
.bub .sp{width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:650;font-size:12px;flex:none}
.bub .spk{margin-right:6px;vertical-align:middle;display:inline-grid}
.u-act{position:sticky;bottom:12px;margin-top:20px;display:flex;align-items:center;gap:10px;padding:10px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(16,24,40,.08)}
.u-nav{flex:1;display:flex}.u-nav.r{justify-content:flex-end}
.u-mid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* runner */
.main.running{max-width:760px}
.run-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:8px}
.run-h>b{font-size:16px;text-align:center}.run-h>span{justify-self:end;font-size:14px}.run-h .btn{justify-self:start}
.qbar{margin-bottom:12px}
.qcard{padding:24px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.qp{font-size:18px;text-align:center;line-height:1.55}
.qp b{font-weight:600}
.ctx{background:var(--soft);border-radius:8px;padding:8px 14px;font-size:14px;text-align:justify}
.ctx summary{cursor:pointer;font-weight:550;color:var(--acc)}
.ctx p{margin:8px 0}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font-size:15.5px;font-weight:500;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center}
.opts.two .opt{justify-content:center}
.okey{width:24px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.fade{opacity:.5}
.big-spk{display:flex;justify-content:center;align-items:center;gap:12px}
.typef{display:flex;gap:10px}
.typef input{flex:1;font-size:17px;padding:11px 14px}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fb.right{background:var(--okbg)}.fb.wrong{background:var(--redbg)}
.fb.right>b{color:var(--ok)}.fb.wrong>b{color:var(--red)}
.fb-say{display:flex;gap:6px;align-items:center}
.fb .btn{align-self:stretch;margin-top:6px}
.scr-ans{min-height:64px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.scr-ans.right{border-color:var(--ok);background:var(--okbg)}.scr-ans.wrong{border-color:var(--red);background:var(--redbg)}
.scr-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:15.5px;font-weight:550;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tok.used{visibility:hidden}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:250px;width:100%;cursor:pointer;padding:24px;text-align:center}
.flash.back{background:var(--acc-soft)}
.f-big{font-size:32px;letter-spacing:-.02em;font-weight:650}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;width:100%}
.center>.spk{margin:12px auto 0}
.flash-ok{box-shadow:0 0 0 2px var(--ok)}.flash-bad{box-shadow:0 0 0 2px var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match>div{display:flex;flex-direction:column;gap:8px}
.mcell{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 10px;font-weight:550;font-size:15px;cursor:pointer;min-height:54px}
.mcell.sel{border-color:var(--acc);background:var(--acc-soft)}
.mcell.done{opacity:.35;border-color:var(--ok);background:var(--okbg)}
.mcell.bad{border-color:var(--red);background:var(--redbg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lives{font-size:13px;color:var(--muted)}
.hword{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:26px;font-weight:650;text-transform:lowercase}
.hl{width:28px;border-bottom:2px solid var(--text);text-align:center;min-height:40px}
.hword .sp{width:16px}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:9px 0;font-weight:600;font-size:15px;cursor:pointer;text-transform:uppercase}
.key.hit{background:var(--okbg);border-color:var(--ok)}.key.miss{background:var(--redbg);opacity:.6}
.say-big{font-size:21px;display:flex;gap:10px;align-items:center;justify-content:center}
.mic{margin:0 auto}.mic.on{background:var(--red);border-color:var(--red);color:#fff}
.result{padding:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.result h2{margin:6px 0 0}.result p{margin:0}
.res-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
/* pdf */
.pdfcard{padding:18px 20px;margin-top:16px}
.pdf-h h2{margin:0 0 4px;font-size:17px}.pdf-h p{margin:0}
.pdf-levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.pdfb{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.pdfb .ic{grid-row:1/3;grid-column:2;color:var(--acc)}
.pdfb.all{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.pdfb.busy,.btn.busy{opacity:.55;pointer-events:none}
/* progress */

COURSE.push({

  units: [
    { id: 'p-s1', type: 'sound', title: 'Empat Nada Mandarin', zh: '声调 · shēngdiào',
      explain: '<p>Bahasa Mandarin adalah bahasa <b>bernada</b>. Suku kata yang sama dengan nada berbeda memiliki arti berbeda: <b>mā</b> (妈, ibu), <b>má</b> (麻, kebas), <b>mǎ</b> (马, kuda), <b>mà</b> (骂, memarahi). Nada ditulis dengan tanda di atas huruf vokal pinyin.</p><table class="gt"><tr><th>Nada</th><th>Tanda</th><th>Cara mengucapkan</th></tr><tr><td>1</td><td>ā</td><td>Datar dan tinggi, seperti menahan nada “laaa” saat bernyanyi.</td></tr><tr><td>2</td><td>á</td><td>Naik dari tengah ke atas, seperti bertanya “hah?”.</td></tr><tr><td>3</td><td>ǎ</td><td>Turun rendah lalu naik sedikit. Dalam percakapan cepat sering hanya terdengar rendah.</td></tr><tr><td>4</td><td>à</td><td>Turun tajam dari atas ke bawah, seperti membentak “tidak!”.</td></tr><tr><td>Netral</td><td>a</td><td>Pendek dan ringan, tanpa tanda. Contoh: māma, xièxie.</td></tr></table><p class="tip">Kunci cepat bicara: ucapkan nada dengan berlebihan saat berlatih. Orang Tiongkok lebih memahami nada yang jelas walaupun bunyi konsonannya kurang tepat.</p>',
      items: ['mā|妈|ibu', 'má|麻|kebas', 'mǎ|马|kuda', 'mà|骂|memarahi', 'bā|八|delapan', 'bá|拔|mencabut', 'bǎ|把|memegang', 'bà|爸|ayah', 'tāng|汤|sup', 'táng|糖|gula, permen', 'tǎng|躺|berbaring', 'tàng|烫|panas sekali', 'shī|师|guru', 'shí|十|sepuluh', 'shǐ|使|menggunakan', 'shì|是|adalah', 'yī|衣|pakaian', 'yí|姨|bibi', 'yǐ|椅|kursi', 'yì|亿|seratus juta', 'Zhōngguó|中国|Tiongkok', 'Běijīng|北京|Beijing', 'lǎoshī|老师|guru', 'Hànyǔ|汉语|bahasa Mandarin', 'péngyou|朋友|teman', 'xièxie|谢谢|terima kasih'] },

      '我|wǒ|saya, aku|我是印度尼西亚人。|Wǒ shì Yìndùníxīyà rén.|Saya orang Indonesia.',

      '您|nín|Anda (sopan)|您好，请进！|Nín hǎo, qǐng jìn!|Halo, silakan masuk!',

    { id: 'p-g1', type: 'grammar', title: 'Kalimat dengan 是 (adalah)', zh: '是字句 · shì zì jù',
      explain: '<p>Kata kerja Mandarin <b>tidak pernah berubah bentuk</b>: tidak ada konjugasi, tidak ada bentuk lampau, tidak ada jamak. Ini membuat tata bahasa dasarnya mirip bahasa Indonesia.</p><p><b>是 (shì)</b> menghubungkan dua kata benda: “A adalah B”. Bentuk negatifnya <b>不是 (bú shì)</b>. Kata <b>也 (yě, juga)</b> dan <b>都 (dōu, semua)</b> selalu diletakkan <b>sebelum</b> kata kerja.</p><ul><li>我是学生。 Saya (adalah) pelajar.</li><li>我不是老师。 Saya bukan guru.</li><li>我们都是印尼人。 Kami semua orang Indonesia.</li></ul><p class="tip">是 hanya untuk kata benda. Untuk kata sifat jangan memakai 是: “我是忙” salah, yang benar “我很忙” (materi berikutnya).</p>',
      pattern: ['A + 是 + B', 'A + 不是 + B', 'A + 也 / 都 + 是 + B'],
      examples: ['我是学生。|Wǒ shì xuésheng.|Saya pelajar.', '他是老师。|Tā shì lǎoshī.|Dia guru.', '我不是中国人。|Wǒ bú shì Zhōngguó rén.|Saya bukan orang Tiongkok.', '她是我妈妈。|Tā shì wǒ māma.|Dia ibu saya.', '我们都是印尼人。|Wǒmen dōu shì Yìnní rén.|Kami semua orang Indonesia.', '他也是医生。|Tā yě shì yīshēng.|Dia juga dokter.', '这是我的书。|Zhè shì wǒ de shū.|Ini buku saya.', '那不是我的手机。|Nà bú shì wǒ de shǒujī.|Itu bukan ponsel saya.'],
      quiz: ['我___学生。|Wǒ ___ xuésheng.|是:shì|在:zài|有:yǒu|Saya pelajar.', '他___是老师，他是医生。|Tā ___ shì lǎoshī, tā shì yīshēng.|不:bú|没:méi|很:hěn|Dia bukan guru, dia dokter.', '我是印尼人，她___是印尼人。|Wǒ shì Yìnní rén, tā ___ shì Yìnní rén.|也:yě|很:hěn|吗:ma|Saya orang Indonesia, dia juga orang Indonesia.', '我们___是学生。|Wǒmen ___ shì xuésheng.|都:dōu|很:hěn|吗:ma|Kami semua pelajar.', '这___我的书。|Zhè ___ wǒ de shū.|是:shì|有:yǒu|叫:jiào|Ini buku saya.', '她___我妈妈。|Tā ___ wǒ māma.|是:shì|的:de|在:zài|Dia ibu saya.', '那不是我___手机。|Nà bú shì wǒ ___ shǒujī.|的:de|是:shì|吗:ma|Itu bukan ponsel saya.', '你___什么名字？|Nǐ ___ shénme míngzi?|叫:jiào|是:shì|有:yǒu|Siapa namamu?']
    },

    { id: 'p-s2', type: 'sound', title: 'Konsonan Awal', zh: '声母 · shēngmǔ',
      explain: '<p>Setiap suku kata Mandarin terdiri dari <b>konsonan awal</b> (声母), <b>vokal akhir</b> (韵母), dan <b>nada</b>. Sebagian besar konsonan mirip bahasa Indonesia, tetapi beberapa perlu perhatian khusus:</p><table class="gt"><tr><th>Pinyin</th><th>Bunyi mendekati</th><th>Contoh</th></tr><tr><td>b · d · g</td><td>p, t, k tanpa hembusan udara</td><td>bā, dà, gē</td></tr><tr><td>p · t · k</td><td>p, t, k dengan hembusan kuat</td><td>pà, tā, kàn</td></tr><tr><td>j</td><td>“j” ringan, lidah datar</td><td>jī (ayam)</td></tr><tr><td>q</td><td>“c” seperti <i>cium</i>, dengan hembusan</td><td>qù (pergi)</td></tr><tr><td>x</td><td>“sy” tipis, bibir tersenyum</td><td>xiè (terima kasih)</td></tr><tr><td>zh · ch · sh</td><td>j, c, sy dengan ujung lidah ditekuk ke atas</td><td>zhī, chī, shū</td></tr><tr><td>z</td><td>“dz” seperti pada <i>pizza</i></td><td>zài</td></tr><tr><td>c</td><td>“ts” dengan hembusan</td><td>cài</td></tr><tr><td>r</td><td>antara “r” Inggris dan “zh” Prancis</td><td>rè (panas)</td></tr><tr><td>h</td><td>“kh” ringan dari tenggorokan</td><td>hē (minum)</td></tr></table><p class="tip">Uji hembusan: dekatkan telapak tangan ke mulut. Pada p, t, k, q, ch, c terasa hembusan udara; pada b, d, g, j, zh, z hampir tidak terasa.</p>',
      items: ['bà|爸|ayah|pà|dà|mà', 'pǎo|跑|berlari|bǎo|kǎo|hǎo', 'dà|大|besar|tà|là|nà', 'tā|他|dia|dā|kā|fā', 'gē|哥|kakak laki-laki|kē|hē|dē', 'kàn|看|melihat|gàn|hàn|tàn', 'hē|喝|minum|kē|gē|dē', 'jī|鸡|ayam|qī|xī|zhī', 'qù|去|pergi|jù|xù|chù', 'xiè|谢|terima kasih|jiè|qiè|shè', 'zhī|知|tahu|zī|jī|chī', 'chī|吃|makan|qī|cī|shī', 'shū|书|buku|sū|xū|zhū', 'rè|热|panas|lè|yè|zhè', 'zài|在|di; sedang|cài|sài|zhài', 'cài|菜|sayur, lauk|zài|sài|chài', 'sì|四|empat|shì|xì|cì', 'shí|十|sepuluh|xí|chí|zhí', 'nǐ|你|kamu|lǐ|mǐ|yǐ', 'fàn|饭|nasi|huàn|bàn|pàn'] },

    { id: 'p-g2', type: 'grammar', title: 'Bertanya dengan 吗 dan 呢', zh: '吗和呢 · ma hé ne',
      explain: '<p>Cara termudah membuat pertanyaan: ambil kalimat berita, lalu tambahkan <b>吗 (ma)</b> di akhir. Susunan kata tidak berubah.</p><ul><li>你是老师。 Kamu guru. → 你是老师<b>吗</b>？ Apakah kamu guru?</li></ul><p>Jawabannya dengan mengulang kata kerja atau kata sifat: <b>是 / 不是</b>, <b>忙 / 不忙</b>, <b>喜欢 / 不喜欢</b>. Bahasa Mandarin jarang memakai “ya” dan “tidak” saja.</p><p><b>呢 (ne)</b> dipakai untuk bertanya balik “bagaimana dengan …?” atau menanyakan keberadaan sesuatu: 我的手机呢？ (Ponsel saya mana?)</p><p class="tip">Kalimat yang sudah memakai kata tanya seperti 什么, 谁, 哪儿 tidak boleh ditambah 吗.</p>',
      pattern: ['Kalimat berita + 吗？', 'Kata benda / orang + 呢？ (bagaimana dengan …?)', 'Jawaban: ulangi kata kerja → 是 / 不是, 喜欢 / 不喜欢'],
      examples: ['你是老师吗？|Nǐ shì lǎoshī ma?|Apakah kamu guru?', '你忙吗？|Nǐ máng ma?|Kamu sibuk?', '他是中国人吗？|Tā shì Zhōngguó rén ma?|Apakah dia orang Tiongkok?', '你喜欢喝茶吗？|Nǐ xǐhuan hē chá ma?|Kamu suka minum teh?', '我很好，你呢？|Wǒ hěn hǎo, nǐ ne?|Saya baik, kamu bagaimana?', '我是工程师，你呢？|Wǒ shì gōngchéngshī, nǐ ne?|Saya insinyur, kalau kamu?', '我的手机呢？|Wǒ de shǒujī ne?|Ponsel saya mana?', '你叫什么名字？|Nǐ jiào shénme míngzi?|Siapa namamu?'],
      quiz: ['你是学生___？|Nǐ shì xuésheng ___?|吗:ma|呢:ne|的:de|Apakah kamu pelajar?', '我很好，你___？|Wǒ hěn hǎo, nǐ ___?|呢:ne|吗:ma|是:shì|Saya baik, kamu?', '他___中国人吗？|Tā ___ Zhōngguó rén ma?|是:shì|呢:ne|吗:ma|Apakah dia orang Tiongkok?', '你忙___？——我不忙。|Nǐ máng ___? — Wǒ bù máng.|吗:ma|呢:ne|不:bù|Kamu sibuk? — Saya tidak sibuk.', '我的钥匙___？|Wǒ de yàoshi ___?|呢:ne|吗:ma|是:shì|Kunci saya mana?', '你喜欢咖啡吗？——我___喜欢。|Nǐ xǐhuan kāfēi ma? — Wǒ ___ xǐhuan.|不:bù|吗:ma|呢:ne|Kamu suka kopi? — Saya tidak suka.', '他是老师，你___？|Tā shì lǎoshī, nǐ ___?|呢:ne|吗:ma|的:de|Dia guru, kalau kamu?', '你是印尼人吗？——我___印尼人。|Nǐ shì Yìnní rén ma? — Wǒ ___ Yìnní rén.|是:shì|吗:ma|很:hěn|Kamu orang Indonesia? — Ya, saya orang Indonesia.']
    },

    { id: 'p-s3', type: 'sound', title: 'Vokal Akhir & Perubahan Nada', zh: '韵母和变调 · yùnmǔ hé biàndiào',
      explain: '<p><b>Vokal akhir</b> (韵母) yang sering keliru diucapkan penutur Indonesia:</p><table class="gt"><tr><th>Pinyin</th><th>Bunyi mendekati</th><th>Contoh</th></tr><tr><td>e</td><td>“e” pepet yang ditarik ke belakang, seperti <i>“eu”</i> Sunda</td><td>hē, rè</td></tr><tr><td>ü (yu, ju, qu, xu)</td><td>ucapkan “i” sambil memonyongkan bibir</td><td>nǚ, yú, qù</td></tr><tr><td>-i setelah zh, ch, sh, r</td><td>bukan “i”, tetapi dengung lidah ditekuk</td><td>zhī, chī, shí</td></tr><tr><td>-i setelah z, c, s</td><td>dengung “zzz” pendek</td><td>zì, cì, sì</td></tr><tr><td>an · ang</td><td>-n di depan lidah, -ng di belakang</td><td>fàn, fāng</td></tr><tr><td>ian (yan)</td><td>dibaca “yen”</td><td>qián, xiān</td></tr><tr><td>ui · iu · un</td><td>singkatan dari uei, iou, uen</td><td>shuǐ, liù, chūn</td></tr><tr><td>er</td><td>“er” dengan lidah ditekuk</td><td>èr</td></tr></table><p><b>Perubahan nada</b> (变调) yang wajib diketahui:</p><ul><li>Nada 3 + nada 3 → nada pertama dibaca nada 2: nǐ hǎo dibaca <b>ní hǎo</b>.</li><li>不 (bù) sebelum nada 4 menjadi <b>bú</b>: bú shì, bú yào.</li><li>一 (yī) sebelum nada 4 menjadi <b>yí</b> (yí ge), sebelum nada 1, 2, 3 menjadi <b>yì</b> (yìqǐ, yìbǎi).</li></ul><p class="tip">Di materi ini, 不 dan 一 ditulis sesuai bunyi yang diucapkan (bú shì, yí ge), sedangkan nada 3 + 3 tetap ditulis aslinya.</p>',
      items: ['mén|门|pintu|méng|mín|mán', 'fēng|风|angin|fēn|fāng|hōng', 'xīn|新|baru|xīng|xūn|xiān', 'xìng|姓|bermarga|xìn|xiàng|shèng', 'nǚ|女|perempuan|nǔ|nǐ|niǔ', 'lǜ|绿|hijau|lù|lì|liù', 'yú|鱼|ikan|yóu|yí|wú', 'qián|钱|uang|qín|quán|qiáng', 'xué|学|belajar|xié|xú|jué', 'duō|多|banyak|dōu|duī|tuō', 'hǎo|好|baik|hǒu|hǎi|hǎn', 'lái|来|datang|léi|láo|lán', 'èr|二|dua|è|ài|òu', 'chuān|穿|memakai (baju)|chuāng|chān|cuān', 'zhōng|中|tengah|zhāng|zhēng|zōng', 'shuǐ|水|air|shuǎi|suǐ|shǔ', 'zì|字|huruf|zhì|cì|jì', 'bú shì|不是|bukan|bù shì|bū shì|bú shí'] },

    { id: 'p-g3', type: 'grammar', title: 'Kata Sifat dengan 很 & Kepemilikan 的', zh: '很和的 · hěn hé de',
      explain: '<p>Dalam bahasa Mandarin, <b>kata sifat langsung menjadi predikat</b> tanpa 是. Biasanya ditambah <b>很 (hěn)</b> di depannya. 很 di sini sering tidak berarti “sangat”, hanya membuat kalimat terdengar wajar.</p><ul><li>我很忙。 Saya sibuk. (bukan 我是忙)</li><li>他不高。 Dia tidak tinggi. (negatif dengan 不, tanpa 很)</li></ul><p><b>的 (de)</b> menunjukkan kepemilikan, seperti “-nya” atau “milik”: 我<b>的</b>书 (buku saya), 老师<b>的</b>手机 (ponsel guru). Untuk keluarga dan orang dekat, 的 boleh dihilangkan: 我妈妈, 我朋友.</p><p>的 juga menghubungkan kata sifat dengan kata benda: 漂亮<b>的</b>衣服 (baju yang bagus). Kata sifat satu suku kata cukup langsung: 好朋友, 新手机.</p><p class="tip">Urutan Mandarin: <b>keterangan di depan</b>, benda di belakang. “Buku saya” = 我的书, “teman baik” = 好朋友.</p>',
      pattern: ['Subjek + 很 + kata sifat', 'Subjek + 不 + kata sifat', 'Pemilik + 的 + benda', 'Kata sifat + 的 + benda'],
      examples: ['我很忙。|Wǒ hěn máng.|Saya sibuk.', '今天很冷。|Jīntiān hěn lěng.|Hari ini dingin.', '这个菜很好吃。|Zhège cài hěn hǎochī.|Masakan ini enak.', '他不高。|Tā bù gāo.|Dia tidak tinggi.', '这是我的手机。|Zhè shì wǒ de shǒujī.|Ini ponsel saya.', '她是我妈妈。|Tā shì wǒ māma.|Dia ibu saya.', '我有一件漂亮的衣服。|Wǒ yǒu yí jiàn piàoliang de yīfu.|Saya punya sebuah baju yang bagus.', '中文不太难。|Zhōngwén bú tài nán.|Bahasa Mandarin tidak terlalu sulit.'],
      quiz: ['我___忙。|Wǒ ___ máng.|很:hěn|是:shì|的:de|Saya sibuk.', '这是我___书。|Zhè shì wǒ ___ shū.|的:de|很:hěn|是:shì|Ini buku saya.', '今天___冷，很热。|Jīntiān ___ lěng, hěn rè.|不:bù|没:méi|很:hěn|Hari ini tidak dingin, panas.', '他很___。|Tā hěn ___.|高:gāo|是:shì|有:yǒu|Dia tinggi.', '那是谁___手机？|Nà shì shéi ___ shǒujī?|的:de|很:hěn|吗:ma|Itu ponsel siapa?', '这个菜很___。|Zhège cài hěn ___.|好吃:hǎochī|吃:chī|菜:cài|Masakan ini enak.', '汉语不太___。|Hànyǔ bú tài ___.|难:nán|是:shì|的:de|Bahasa Mandarin tidak terlalu sulit.', '她是我的好___。|Tā shì wǒ de hǎo ___.|朋友:péngyou|很:hěn|的:de|Dia sahabat saya.']
    },

    { id: 'p-g4', type: 'grammar', title: 'Kata Bantu Bilangan & 这 / 那', zh: '量词 · liàngcí',
      explain: '<p>Di antara <b>angka</b> (atau 这 ini / 那 itu / 哪 yang mana) dan <b>kata benda</b> wajib ada kata bantu bilangan, mirip “sebuah”, “seekor”, “selembar” dalam bahasa Indonesia, tetapi dalam Mandarin tidak boleh dilewatkan.</p><table class="gt"><tr><th>Kata bantu</th><th>Untuk</th><th>Contoh</th></tr><tr><td>个 ge</td><td>umum, orang, benda apa saja</td><td>一个人, 两个苹果</td></tr><tr><td>本 běn</td><td>buku, majalah</td><td>三本书</td></tr><tr><td>杯 bēi</td><td>gelas, cangkir</td><td>一杯水</td></tr><tr><td>张 zhāng</td><td>benda tipis datar: kertas, tiket, meja</td><td>两张票</td></tr><tr><td>件 jiàn</td><td>baju, urusan</td><td>一件衣服</td></tr><tr><td>辆 liàng</td><td>kendaraan</td><td>一辆车</td></tr><tr><td>双 shuāng</td><td>pasangan: sepatu, sumpit</td><td>一双鞋</td></tr><tr><td>块 kuài</td><td>potongan; juga satuan uang yuan</td><td>五块钱</td></tr></table><p class="tip">Angka 2 di depan kata bantu bilangan dibaca <b>两 (liǎng)</b>, bukan 二: 两个人, 两杯茶. Kalau ragu, pakai 个: hampir selalu dimengerti.</p>',
      pattern: ['Angka + kata bantu bilangan + benda', '这 / 那 + kata bantu bilangan + benda', '两 (bukan 二) + kata bantu bilangan + benda'],
      examples: ['我有两个孩子。|Wǒ yǒu liǎng ge háizi.|Saya punya dua anak.', '我买了三本书。|Wǒ mǎi le sān běn shū.|Saya membeli tiga buku.', '请给我一杯水。|Qǐng gěi wǒ yì bēi shuǐ.|Tolong beri saya segelas air.', '这件衣服很漂亮。|Zhè jiàn yīfu hěn piàoliang.|Baju ini bagus.', '那个人是谁？|Nàge rén shì shéi?|Orang itu siapa?', '我要两张票。|Wǒ yào liǎng zhāng piào.|Saya mau dua tiket.', '他家有一辆车。|Tā jiā yǒu yí liàng chē.|Keluarganya punya satu mobil.', '这双鞋多少钱？|Zhè shuāng xié duōshao qián?|Sepasang sepatu ini berapa?'],

    { id: 'p-g5', type: 'grammar', title: 'Urutan Kalimat: Waktu & Tempat', zh: '语序 · yǔxù',
      explain: '<p>Urutan kata Mandarin tetap: <b>Subjek + Waktu + Tempat + Kegiatan</b>. Berbeda dengan bahasa Indonesia yang sering menaruh waktu dan tempat di akhir kalimat.</p><ul><li>Indonesia: Saya makan <b>di restoran</b> <b>malam ini</b>.</li><li>Mandarin: 我<b>今天晚上</b><b>在饭店</b>吃饭。 (Saya malam ini di restoran makan.)</li></ul><p>Keterangan waktu boleh juga diletakkan sebelum subjek: 明天我去北京。 Tempat kegiatan ditandai <b>在 (zài) + tempat</b> sebelum kata kerja.</p><p><b>在</b> juga bisa berdiri sendiri sebagai kata kerja “berada di”: 我在家 (Saya di rumah). Negatifnya <b>不在</b>.</p><p class="tip">Rumus cepat: <b>Siapa → kapan → di mana → melakukan apa</b>.</p>',
      pattern: ['Subjek + waktu + 在 + tempat + kegiatan', 'Waktu + subjek + kegiatan', 'Subjek + 在 / 不在 + tempat'],
      examples: ['我在公司工作。|Wǒ zài gōngsī gōngzuò.|Saya bekerja di kantor.', '我每天早上七点吃早饭。|Wǒ měitiān zǎoshang qī diǎn chī zǎofàn.|Saya sarapan setiap pagi jam tujuh.', '他明天在家休息。|Tā míngtiān zài jiā xiūxi.|Besok dia istirahat di rumah.', '我们晚上在饭店吃饭。|Wǒmen wǎnshang zài fàndiàn chī fàn.|Malam ini kami makan di restoran.', '星期六我去商店买东西。|Xīngqīliù wǒ qù shāngdiàn mǎi dōngxi.|Hari Sabtu saya pergi ke toko berbelanja.', '她在北京学习汉语。|Tā zài Běijīng xuéxí Hànyǔ.|Dia belajar bahasa Mandarin di Beijing.', '你在哪儿工作？|Nǐ zài nǎr gōngzuò?|Kamu bekerja di mana?', '我妈妈不在家。|Wǒ māma bú zài jiā.|Ibu saya tidak di rumah.'],
      quiz: ['我___公司工作。|Wǒ ___ gōngsī gōngzuò.|在:zài|是:shì|有:yǒu|Saya bekerja di kantor.', '你在___工作？|Nǐ zài ___ gōngzuò?|哪儿:nǎr|什么:shénme|谁:shéi|Kamu bekerja di mana?', '我妈妈___在家。|Wǒ māma ___ zài jiā.|不:bú|很:hěn|是:shì|Ibu saya tidak di rumah.', '他___在家休息。|Tā ___ zài jiā xiūxi.|明天:míngtiān|哪儿:nǎr|什么:shénme|Besok dia istirahat di rumah.', '我们晚上在饭店___饭。|Wǒmen wǎnshang zài fàndiàn ___ fàn.|吃:chī|喝:hē|看:kàn|Malam ini kami makan di restoran.', '星期六我___商店买东西。|Xīngqīliù wǒ ___ shāngdiàn mǎi dōngxi.|去:qù|是:shì|很:hěn|Hari Sabtu saya pergi ke toko berbelanja.', '她在北京___汉语。|Tā zài Běijīng ___ Hànyǔ.|学习:xuéxí|学校:xuéxiào|学生:xuésheng|Dia belajar bahasa Mandarin di Beijing.', '我每天七点___早饭。|Wǒ měitiān qī diǎn ___ zǎofàn.|吃:chī|喝:hē|说:shuō|Saya sarapan setiap hari jam tujuh.']
    },
    { id: 'p-g6', type: 'grammar', title: 'Kata Tanya', zh: '疑问词 · yíwèncí',
      explain: '<p>Kata tanya Mandarin diletakkan <b>di posisi jawabannya</b>, tidak dipindah ke depan kalimat. Kalimatnya tidak memakai 吗.</p><table class="gt"><tr><th>Kata tanya</th><th>Arti</th><th>Contoh</th></tr><tr><td>什么 shénme</td><td>apa</td><td>你喝什么？</td></tr><tr><td>谁 shéi</td><td>siapa</td><td>他是谁？</td></tr><tr><td>哪儿 nǎr</td><td>di mana</td><td>你在哪儿？</td></tr><tr><td>哪 nǎ</td><td>yang mana</td><td>你是哪国人？</td></tr><tr><td>几 jǐ</td><td>berapa (di bawah 10, jam, tanggal)</td><td>几点？几个？</td></tr><tr><td>多少 duōshao</td><td>berapa (jumlah besar, harga)</td><td>多少钱？</td></tr><tr><td>怎么 zěnme</td><td>bagaimana (caranya)</td><td>怎么走？</td></tr><tr><td>为什么 wèi shénme</td><td>mengapa</td><td>为什么学汉语？</td></tr><tr><td>什么时候 shénme shíhou</td><td>kapan</td><td>你什么时候来？</td></tr></table><p class="tip">Cara mudah: tulis kalimat jawabannya, lalu ganti bagian yang ditanyakan dengan kata tanya. 我喝<b>茶</b>。 → 你喝<b>什么</b>？</p>',
      pattern: ['Kata tanya menggantikan bagian yang ditanyakan', 'Tanpa 吗 di akhir kalimat', '几 + kata bantu bilangan · 多少 (+ kata bantu bilangan)'],
      examples: ['你喝什么？|Nǐ hē shénme?|Kamu minum apa?', '他是谁？|Tā shì shéi?|Dia siapa?', '洗手间在哪儿？|Xǐshǒujiān zài nǎr?|Toilet di mana?', '你有几个孩子？|Nǐ yǒu jǐ ge háizi?|Kamu punya berapa anak?', '这个多少钱？|Zhège duōshao qián?|Ini berapa harganya?', '去机场怎么走？|Qù jīchǎng zěnme zǒu?|Ke bandara lewat mana?', '你为什么学汉语？|Nǐ wèi shénme xué Hànyǔ?|Mengapa kamu belajar bahasa Mandarin?', '你什么时候回国？|Nǐ shénme shíhou huí guó?|Kapan kamu pulang ke negaramu?'],
      quiz: ['你喝___？——我喝茶。|Nǐ hē ___? — Wǒ hē chá.|什么:shénme|谁:shéi|哪儿:nǎr|Kamu minum apa? — Saya minum teh.', '他是___？——他是我哥哥。|Tā shì ___? — Tā shì wǒ gēge.|谁:shéi|什么:shénme|几:jǐ|Dia siapa? — Dia kakak laki-laki saya.', '洗手间在___？|Xǐshǒujiān zài ___?|哪儿:nǎr|谁:shéi|几:jǐ|Toilet di mana?', '你有___个孩子？|Nǐ yǒu ___ ge háizi?|几:jǐ|什么:shénme|哪儿:nǎr|Kamu punya berapa anak?', '这件衣服___钱？|Zhè jiàn yīfu ___ qián?|多少:duōshao|什么:shénme|谁:shéi|Baju ini berapa harganya?', '去机场___走？|Qù jīchǎng ___ zǒu?|怎么:zěnme|什么:shénme|谁:shéi|Ke bandara lewat mana?', '你___学汉语？——因为我喜欢中国文化。|Nǐ ___ xué Hànyǔ? — Yīnwèi wǒ xǐhuan Zhōngguó wénhuà.|为什么:wèi shénme|什么:shénme|哪儿:nǎr|Mengapa kamu belajar Mandarin? — Karena saya suka budaya Tiongkok.', '你___回国？——下个月。|Nǐ ___ huí guó? — Xià ge yuè.|什么时候:shénme shíhou|为什么:wèi shénme|怎么:zěnme|Kapan kamu pulang ke negaramu? — Bulan depan.']

    { id: 'p-t5', type: 'topic', cat: 'daily', title: 'Keluarga & Hobi', zh: '家人和爱好 · jiārén hé àihào',
      phrases: ['你家有几口人？|Nǐ jiā yǒu jǐ kǒu rén?|Keluargamu ada berapa orang?', '我家有四口人。|Wǒ jiā yǒu sì kǒu rén.|Keluarga saya ada empat orang.', '你结婚了吗？|Nǐ jiéhūn le ma?|Kamu sudah menikah?', '我结婚了，有一个女儿。|Wǒ jiéhūn le, yǒu yí ge nǚ\'ér.|Saya sudah menikah, punya satu anak perempuan.', '你有兄弟姐妹吗？|Nǐ yǒu xiōngdì jiěmèi ma?|Kamu punya saudara kandung?', '我是独生子。|Wǒ shì dúshēngzǐ.|Saya anak tunggal.', '你的爱好是什么？|Nǐ de àihào shì shénme?|Apa hobimu?', '我喜欢踢足球。|Wǒ xǐhuan tī zúqiú.|Saya suka bermain sepak bola.', '我喜欢看电影。|Wǒ xǐhuan kàn diànyǐng.|Saya suka menonton film.', '周末你常常做什么？|Zhōumò nǐ chángcháng zuò shénme?|Akhir pekan kamu biasanya melakukan apa?', '我常常跟家人一起吃饭。|Wǒ chángcháng gēn jiārén yìqǐ chī fàn.|Saya sering makan bersama keluarga.', '真的吗？我也是！|Zhēn de ma? Wǒ yě shì!|Benarkah? Saya juga!'],
      dialog: ['A|这是你的家人吗？|Zhè shì nǐ de jiārén ma?|Ini keluargamu?', 'B|对，这是我爸爸、妈妈和我妹妹。|Duì, zhè shì wǒ bàba, māma hé wǒ mèimei.|Ya, ini ayah, ibu, dan adik perempuan saya.', 'A|你妹妹多大了？|Nǐ mèimei duō dà le?|Adik perempuanmu umur berapa?', 'B|她十八岁，是大学生。你有兄弟姐妹吗？|Tā shíbā suì, shì dàxuéshēng. Nǐ yǒu xiōngdì jiěmèi ma?|Dia 18 tahun, mahasiswi. Kamu punya saudara kandung?', 'A|我有一个哥哥。他喜欢踢足球。|Wǒ yǒu yí ge gēge. Tā xǐhuan tī zúqiú.|Saya punya satu kakak laki-laki. Dia suka sepak bola.', 'B|你呢？你的爱好是什么？|Nǐ ne? Nǐ de àihào shì shénme?|Kalau kamu? Apa hobimu?', 'A|我喜欢做饭，也喜欢唱歌。|Wǒ xǐhuan zuò fàn, yě xǐhuan chàng gē.|Saya suka memasak, juga suka menyanyi.', 'B|真的吗？我也喜欢唱歌！|Zhēn de ma? Wǒ yě xǐhuan chàng gē!|Benarkah? Saya juga suka menyanyi!'],
      resp: ['你家有几口人？|Nǐ jiā yǒu jǐ kǒu rén?|Keluargamu ada berapa orang?|五口人。:Wǔ kǒu rén.|五块钱。:Wǔ kuài qián.|五点。:Wǔ diǎn.|Lima orang.', '你结婚了吗？|Nǐ jiéhūn le ma?|Kamu sudah menikah?|还没有。:Hái méiyǒu.|不客气。:Bú kèqi.|我很饿。:Wǒ hěn è.|Belum.', '你的爱好是什么？|Nǐ de àihào shì shénme?|Apa hobimu?|我喜欢游泳。:Wǒ xǐhuan yóuyǒng.|我是医生。:Wǒ shì yīshēng.|我在家。:Wǒ zài jiā.|Saya suka berenang.', '你妹妹多大了？|Nǐ mèimei duō dà le?|Adikmu umur berapa?|她十岁。:Tā shí suì.|她很高。:Tā hěn gāo.|她在学校。:Tā zài xuéxiào.|Dia sepuluh tahun.'] },
    { id: 'p-g7', type: 'grammar', title: '想, 要, 会, 能, 可以', zh: '能愿动词 · néngyuàn dòngcí',
      explain: '<p>Kata kerja bantu diletakkan <b>sebelum kata kerja utama</b>. Bahasa Indonesia sering memakai satu kata “bisa” untuk tiga makna yang dibedakan dalam Mandarin:</p><table class="gt"><tr><th>Kata</th><th>Makna</th><th>Contoh</th></tr><tr><td>想 xiǎng</td><td>ingin (keinginan)</td><td>我想去中国。</td></tr><tr><td>要 yào</td><td>mau, akan (lebih tegas)</td><td>我要喝咖啡。</td></tr><tr><td>会 huì</td><td>bisa karena sudah <b>belajar</b> (bahasa, berenang, menyetir)</td><td>我会说汉语。</td></tr><tr><td>能 néng</td><td>bisa karena <b>keadaan atau kemampuan</b> memungkinkan</td><td>我今天不能去。</td></tr><tr><td>可以 kěyǐ</td><td><b>boleh</b> (izin)</td><td>这儿可以拍照吗？</td></tr></table><p>Negatifnya cukup ditambah 不: 不想, 不会, 不能, 不可以. Untuk “tidak mau”, orang biasanya berkata <b>不想</b>, karena 不要 berarti “jangan”.</p><p class="tip">Kalimat paling berguna untuk pemula: <b>我会说一点儿汉语</b> (Saya bisa sedikit bahasa Mandarin).</p>',
      pattern: ['Subjek + 想 / 要 + kata kerja', 'Subjek + 会 + kata kerja (keterampilan)', 'Subjek + 能 + kata kerja (keadaan memungkinkan)', '可以 + kata kerja + 吗？ (minta izin)'],
      examples: ['我想去中国。|Wǒ xiǎng qù Zhōngguó.|Saya ingin pergi ke Tiongkok.', '我要喝咖啡。|Wǒ yào hē kāfēi.|Saya mau minum kopi.', '你会说汉语吗？|Nǐ huì shuō Hànyǔ ma?|Kamu bisa berbicara bahasa Mandarin?', '我会说一点儿汉语。|Wǒ huì shuō yìdiǎnr Hànyǔ.|Saya bisa sedikit bahasa Mandarin.', '他不会游泳。|Tā bú huì yóuyǒng.|Dia tidak bisa berenang.', '我今天很忙，不能去。|Wǒ jīntiān hěn máng, bù néng qù.|Hari ini saya sibuk, tidak bisa pergi.', '这儿可以拍照吗？|Zhèr kěyǐ pāizhào ma?|Di sini boleh memotret?', '你明天能来吗？|Nǐ míngtiān néng lái ma?|Besok kamu bisa datang?'],
      quiz: ['我___去中国旅游。|Wǒ ___ qù Zhōngguó lǚyóu.|想:xiǎng|是:shì|很:hěn|Saya ingin berwisata ke Tiongkok.', '你___说汉语吗？——我会说一点儿。|Nǐ ___ shuō Hànyǔ ma? — Wǒ huì shuō yìdiǎnr.|会:huì|想:xiǎng|可以:kěyǐ|Kamu bisa bahasa Mandarin? — Saya bisa sedikit.', '他不___游泳，他没学过。|Tā bú ___ yóuyǒng, tā méi xué guo.|会:huì|想:xiǎng|要:yào|Dia tidak bisa berenang, dia belum pernah belajar.', '我今天很忙，不___去。|Wǒ jīntiān hěn máng, bù ___ qù.|能:néng|有:yǒu|是:shì|Hari ini saya sibuk, tidak bisa pergi.', '这儿___拍照吗？——不行。|Zhèr ___ pāizhào ma? — Bù xíng.|可以:kěyǐ|会:huì|想:xiǎng|Di sini boleh memotret? — Tidak boleh.', '我___一杯咖啡。|Wǒ ___ yì bēi kāfēi.|要:yào|会:huì|能:néng|Saya mau secangkir kopi.', '我想___中国菜。|Wǒ xiǎng ___ Zhōngguó cài.|吃:chī|会:huì|能:néng|Saya ingin makan masakan Tiongkok.', '你明天___来吗？|Nǐ míngtiān ___ lái ma?|能:néng|很:hěn|是:shì|Besok kamu bisa datang?']
    },
    { id: 'p-g8', type: 'grammar', title: 'Sudah dan Belum: 了 & 没', zh: '了和没 · le hé méi',
      explain: '<p>Karena kata kerja Mandarin tidak berubah bentuk, kejadian yang <b>sudah terjadi</b> ditandai dengan <b>了 (le)</b> setelah kata kerja atau di akhir kalimat.</p><ul><li>我吃了。 Saya sudah makan.</li><li>我买了一本书。 Saya (sudah) membeli sebuah buku.</li></ul><p>Bentuk negatif masa lampau memakai <b>没 / 没有 (méi / méiyǒu)</b> dan <b>tanpa 了</b>: 我没吃早饭 (Saya tidak/belum sarapan). Untuk “belum” yang masih akan terjadi: <b>还没 … 呢</b>.</p><p>了 di akhir kalimat juga menunjukkan <b>perubahan keadaan</b>: 我饿了 (Saya jadi lapar), 下雨了 (Mulai hujan), 太好了 (Bagus sekali).</p><p class="tip">Kesalahan paling umum: “我没吃了”. Ingat: <b>没 dan 了 tidak dipakai bersama</b>.</p>',
      pattern: ['Subjek + kata kerja + 了 + objek', 'Subjek + 没(有) + kata kerja (tanpa 了)', '… 了吗？ / … 了没有？', 'Subjek + 还没 + kata kerja + 呢 (belum)'],
      examples: ['我吃了。|Wǒ chī le.|Saya sudah makan.', '我买了一本书。|Wǒ mǎi le yì běn shū.|Saya membeli sebuah buku.', '他去北京了。|Tā qù Běijīng le.|Dia sudah pergi ke Beijing.', '我没吃早饭。|Wǒ méi chī zǎofàn.|Saya belum sarapan.', '你吃饭了吗？|Nǐ chī fàn le ma?|Kamu sudah makan?', '他还没来呢。|Tā hái méi lái ne.|Dia belum datang.', '下雨了。|Xià yǔ le.|Mulai hujan.', '太好了！|Tài hǎo le!|Bagus sekali!'],
      quiz: ['我昨天买___一件衣服。|Wǒ zuótiān mǎi ___ yí jiàn yīfu.|了:le|的:de|吗:ma|Kemarin saya membeli sebuah baju.', '我昨天___去公司。|Wǒ zuótiān ___ qù gōngsī.|没:méi|不:bù|了:le|Kemarin saya tidak pergi ke kantor.', '你吃饭___吗？|Nǐ chī fàn ___ ma?|了:le|没:méi|不:bù|Kamu sudah makan?', '他还___来呢。|Tā hái ___ lái ne.|没:méi|了:le|很:hěn|Dia belum datang.', '太好___！|Tài hǎo ___!|了:le|吗:ma|呢:ne|Bagus sekali!', '我饿___，我们去吃饭吧。|Wǒ è ___, wǒmen qù chī fàn ba.|了:le|吗:ma|没:méi|Saya lapar, ayo kita makan.', '外面下雨___。|Wàimiàn xià yǔ ___.|了:le|的:de|没:méi|Di luar mulai hujan.', '我没___早饭。|Wǒ méi ___ zǎofàn.|吃:chī|吃了:chī le|了:le|Saya belum sarapan.']
    },
    { id: 'p-r1', type: 'read', title: 'Hariku', zh: '我的一天 · wǒ de yì tiān',
      text: ['我叫安迪，是印度尼西亚人。我今年二十六岁，在雅加达一家中国公司工作。我每天早上六点起床，七点吃早饭。|Wǒ jiào Āndí, shì Yìndùníxīyà rén. Wǒ jīnnián èrshíliù suì, zài Yǎjiādá yì jiā Zhōngguó gōngsī gōngzuò. Wǒ měitiān zǎoshang liù diǎn qǐchuáng, qī diǎn chī zǎofàn.|Nama saya Andi, orang Indonesia. Tahun ini saya 26 tahun dan bekerja di sebuah perusahaan Tiongkok di Jakarta. Setiap hari saya bangun jam enam pagi dan sarapan jam tujuh.',

    { id: 'd-g3', type: 'grammar', title: 'Perbandingan dengan 比', zh: '比较句 · bǐjiào jù',
      explain: '<p><b>A 比 B + kata sifat</b> = A lebih … daripada B. Jangan menambah 很 atau 非常 setelah 比: “他比我很高” salah.</p><ul><li>今天<b>比</b>昨天热。 Hari ini lebih panas daripada kemarin.</li></ul><p>Untuk menyatakan selisih, letakkan setelah kata sifat: <b>一点儿</b> (sedikit lebih), <b>多了 / 得多</b> (jauh lebih), atau angka (她比我大三岁).</p><p>Negatif: <b>A 没有 B + kata sifat</b> (A tidak se- … B). Sama: <b>A 跟 B 一样 + kata sifat</b>. Paling: <b>最 + kata sifat</b>.</p><p class="tip">Rumus: <b>A 比 B + sifat + selisih</b>. Contoh: 坐地铁比坐出租车快多了。</p>',
      pattern: ['A + 比 + B + kata sifat', 'A + 比 + B + kata sifat + 一点儿 / 多了 / angka', 'A + 没有 + B + kata sifat', 'A + 跟 + B + 一样 + kata sifat'],
      examples: ['今天比昨天热。|Jīntiān bǐ zuótiān rè.|Hari ini lebih panas daripada kemarin.', '哥哥比我高。|Gēge bǐ wǒ gāo.|Kakak lebih tinggi daripada saya.', '坐地铁比坐出租车快多了。|Zuò dìtiě bǐ zuò chūzūchē kuài duō le.|Naik MRT jauh lebih cepat daripada naik taksi.', '这件比那件便宜一点儿。|Zhè jiàn bǐ nà jiàn piányi yìdiǎnr.|Yang ini sedikit lebih murah daripada yang itu.', '雅加达没有北京冷。|Yǎjiādá méiyǒu Běijīng lěng.|Jakarta tidak sedingin Beijing.', '我跟他一样大。|Wǒ gēn tā yíyàng dà.|Saya seumur dengan dia.', '她比我大三岁。|Tā bǐ wǒ dà sān suì.|Dia tiga tahun lebih tua dari saya.', '这家饭店的菜最好吃。|Zhè jiā fàndiàn de cài zuì hǎochī.|Masakan restoran ini paling enak.'],
      quiz: ['今天___昨天热。|Jīntiān ___ zuótiān rè.|比:bǐ|很:hěn|跟:gēn|Hari ini lebih panas daripada kemarin.', '哥哥比我___。|Gēge bǐ wǒ ___.|高:gāo|很高:hěn gāo|非常高:fēicháng gāo|Kakak lebih tinggi daripada saya.', '雅加达___北京冷。|Yǎjiādá ___ Běijīng lěng.|没有:méiyǒu|不是:bú shì|不:bù|Jakarta tidak sedingin Beijing.', '我跟他___大。|Wǒ gēn tā ___ dà.|一样:yíyàng|比:bǐ|很:hěn|Saya seumur dengan dia.', '坐地铁比坐出租车快___了。|Zuò dìtiě bǐ zuò chūzūchē kuài ___ le.|多:duō|很:hěn|太:tài|Naik MRT jauh lebih cepat daripada taksi.', '这件比那件便宜___。|Zhè jiàn bǐ nà jiàn piányi ___.|一点儿:yìdiǎnr|很:hěn|有点儿:yǒudiǎnr|Yang ini sedikit lebih murah daripada yang itu.', '她比我大三___。|Tā bǐ wǒ dà sān ___.|岁:suì|年:nián|个:ge|Dia tiga tahun lebih tua dari saya.', '这家饭店的菜___好吃。|Zhè jiā fàndiàn de cài ___ hǎochī.|最:zuì|比:bǐ|跟:gēn|Masakan restoran ini paling enak.']

    { id: 'd-g4', type: 'grammar', title: 'Menilai Tindakan dengan 得', zh: '程度补语 · chéngdù bǔyǔ',
      explain: '<p>Untuk menilai <b>cara atau hasil</b> suatu tindakan (cepat, bagus, lancar), pakai <b>kata kerja + 得 (de) + kata sifat</b>.</p><ul><li>你说<b>得</b>很好。 Kamu berbicara dengan baik.</li><li>她跑<b>得</b>很快。 Dia berlari dengan cepat.</li></ul><p>Jika ada objek, <b>ulangi kata kerjanya</b> atau letakkan objek di depan: 他说汉语<b>说得</b>很流利 = 他汉语说得很流利.</p><p>Negatif: <b>得 + 不 + kata sifat</b> (我睡得不好). Bertanya: <b>得怎么样？</b></p><p class="tip">Tiga “de” berbeda bunyi sama: <b>的</b> (milik, sebelum benda), <b>得</b> (setelah kata kerja, menilai), <b>地</b> (sebelum kata kerja, cara: 慢慢地走).</p>',
      pattern: ['Subjek + kata kerja + 得 + (很) + kata sifat', 'Subjek + (kata kerja) + objek + kata kerja + 得 + kata sifat', 'Subjek + kata kerja + 得 + 不 + kata sifat', 'Kata kerja + 得 + 怎么样？'],
      examples: ['你说得很好。|Nǐ shuō de hěn hǎo.|Kamu berbicara dengan baik.', '他汉语说得很流利。|Tā Hànyǔ shuō de hěn liúlì.|Dia berbahasa Mandarin dengan lancar.', '她跑得很快。|Tā pǎo de hěn kuài.|Dia berlari dengan cepat.', '我昨天睡得不好。|Wǒ zuótiān shuì de bù hǎo.|Semalam saya tidur kurang nyenyak.', '你今天来得真早！|Nǐ jīntiān lái de zhēn zǎo!|Hari ini kamu datang pagi sekali!', '他做饭做得很好吃。|Tā zuò fàn zuò de hěn hǎochī.|Masakannya enak.', '你考得怎么样？|Nǐ kǎo de zěnmeyàng?|Ujianmu bagaimana?', '请说得慢一点儿。|Qǐng shuō de màn yìdiǎnr.|Tolong bicara sedikit lebih pelan.'],

    { id: 'd-g5', type: 'grammar', title: 'Segera, Sudah & Baru: 要…了, 就, 才', zh: '要…了，就，才 · yào…le, jiù, cái',

      dialog: ['A|您好，欢迎光临。请问有预订吗？|Nín hǎo, huānyíng guānglín. Qǐngwèn yǒu yùdìng ma?|Halo, selamat datang. Apakah sudah ada pemesanan?', 'B|有，我在网上订了两个晚上，我叫安迪。|Yǒu, wǒ zài wǎngshang dìng le liǎng ge wǎnshang, wǒ jiào Āndí.|Ada, saya pesan online untuk dua malam, nama saya Andi.', 'A|好的，请出示您的护照。|Hǎo de, qǐng chūshì nín de hùzhào.|Baik, silakan tunjukkan paspor Anda.', 'B|给您。早餐包括在房费里吗？|Gěi nín. Zǎocān bāokuò zài fángfèi li ma?|Ini. Apakah sarapan termasuk dalam harga kamar?', 'A|包括。早餐在二楼，从六点半到十点。|Bāokuò. Zǎocān zài èr lóu, cóng liù diǎn bàn dào shí diǎn.|Termasuk. Sarapan di lantai dua, dari jam 6.30 sampai 10.00.', 'B|无线网密码是多少？|Wúxiàn wǎng mìmǎ shì duōshao?|Kata sandi Wi-Fi berapa?', 'A|密码在房卡上。这是您的房卡，房间在八楼。|Mìmǎ zài fángkǎ shang. Zhè shì nín de fángkǎ, fángjiān zài bā lóu.|Kata sandinya ada di kartu kamar. Ini kartu kamar Anda, kamarnya di lantai delapan.', 'B|谢谢！退房是几点？|Xièxie! Tuìfáng shì jǐ diǎn?|Terima kasih! Check-out jam berapa?'],
      resp: ['请问有预订吗？|Qǐngwèn yǒu yùdìng ma?|Apakah sudah ada pemesanan?|有，我叫安迪。:Yǒu, wǒ jiào Āndí.|有，我是工程师。:Yǒu, wǒ shì gōngchéngshī.|没关系。:Méi guānxi.|Ada, atas nama Andi.', '早餐几点开始？|Zǎocān jǐ diǎn kāishǐ?|Sarapan mulai jam berapa?|六点半开始。:Liù diǎn bàn kāishǐ.|在二楼。:Zài èr lóu.|包括。:Bāokuò.|Mulai jam setengah tujuh.', '房间的空调坏了。|Fángjiān de kōngtiáo huài le.|AC kamar rusak.|对不起，我马上派人去看。:Duìbuqǐ, wǒ mǎshàng pài rén qù kàn.|不客气。:Bú kèqi.|欢迎光临。:Huānyíng guānglín.|Maaf, saya segera kirim orang untuk mengecek.', '几点退房？|Jǐ diǎn tuìfáng?|Check-out jam berapa?|中午十二点以前。:Zhōngwǔ shí\'èr diǎn yǐqián.|在八楼。:Zài bā lóu.|两个晚上。:Liǎng ge wǎnshang.|Sebelum jam 12 siang.'] },

    { id: 'm-g3', type: 'grammar', title: 'Kalimat Pasif 被', zh: '被字句 · bèi zì jù',
      explain: '<p><b>被 (bèi)</b> membentuk kalimat pasif, seperti awalan <b>di-</b> atau <b>ter-</b>. Biasanya dipakai untuk kejadian yang <b>tidak menyenangkan atau tak terduga</b>.</p><ul><li>我的手机<b>被</b>偷了。 Ponsel saya dicuri.</li><li>他<b>被</b>老板批评了。 Dia dimarahi bos.</li></ul><p>Susunannya: <b>penerima + 被 + (pelaku) + kata kerja + unsur lain</b>. Pelaku boleh dihilangkan. Seperti 把, kata kerjanya tidak boleh berdiri sendiri: harus ada 了, hasil (完, 湿), atau arah (走, 开).</p><p>Negasi diletakkan sebelum 被: 我的钱包<b>没被</b>偷. Dalam percakapan, 被 sering diganti <b>叫</b> atau <b>让</b> (dengan pelaku): 我的自行车让朋友借走了.</p><p class="tip">Bandingkan: 我把蛋糕吃完了 (saya menghabiskan kue) ↔ 蛋糕被我吃完了 (kue dihabiskan oleh saya).</p>',
      pattern: ['Penerima + 被 + (pelaku) + kata kerja + 了 / hasil', 'Penerima + 没 + 被 + kata kerja …', 'Lisan: penerima + 叫 / 让 + pelaku + kata kerja + 了'],
      examples: ['我的手机被偷了。|Wǒ de shǒujī bèi tōu le.|Ponsel saya dicuri.', '蛋糕被弟弟吃完了。|Dàngāo bèi dìdi chī wán le.|Kuenya dihabiskan adik.', '他被老板批评了。|Tā bèi lǎobǎn pīpíng le.|Dia dimarahi bos.', '我的自行车被朋友借走了。|Wǒ de zìxíngchē bèi péngyou jiè zǒu le.|Sepeda saya dipinjam teman.', '窗户被风吹开了。|Chuānghu bèi fēng chuī kāi le.|Jendela terbuka tertiup angin.', '衣服被雨淋湿了。|Yīfu bèi yǔ lín shī le.|Bajunya basah kehujanan.', '这个问题已经被解决了。|Zhège wèntí yǐjīng bèi jiějué le.|Masalah ini sudah diselesaikan.', '我的钱包没被偷。|Wǒ de qiánbāo méi bèi tōu.|Dompet saya tidak dicuri.'],
      quiz: ['我的手机___偷了。|Wǒ de shǒujī ___ tōu le.|被:bèi|把:bǎ|在:zài|Ponsel saya dicuri.', '蛋糕被弟弟吃___了。|Dàngāo bèi dìdi chī ___ le.|完:wán|过:guo|着:zhe|Kuenya dihabiskan adik.', '他被老板___了。|Tā bèi lǎobǎn ___ le.|批评:pīpíng|高兴:gāoxìng|容易:róngyì|Dia dimarahi bos.', '我的钱包___被偷。|Wǒ de qiánbāo ___ bèi tōu.|没:méi|不:bù|了:le|Dompet saya tidak dicuri.', '窗户被风吹___了。|Chuānghu bèi fēng chuī ___ le.|开:kāi|完:wán|懂:dǒng|Jendela terbuka tertiup angin.', '衣服被雨淋___了。|Yīfu bèi yǔ lín ___ le.|湿:shī|干:gān|好:hǎo|Bajunya basah kehujanan.', '我的自行车被朋友借___了。|Wǒ de zìxíngchē bèi péngyou jiè ___ le.|走:zǒu|懂:dǒng|错:cuò|Sepeda saya dipinjam (dibawa) teman.', '这个问题已经___解决了。|Zhège wèntí yǐjīng ___ jiějué le.|被:bèi|把:bǎ|比:bǐ|Masalah ini sudah diselesaikan.']
    },
    { id: 'm-g4', type: 'grammar', title: 'Walaupun, Semakin, Begitu', zh: '虽然…但是，越来越，一…就',
      explain: '<p>Tiga pola kalimat majemuk yang sangat sering muncul dalam percakapan:</p><ul><li><b>虽然 … 但是 / 可是 …</b> = walaupun … (tetapi) …. Dalam Mandarin <b>keduanya dipakai bersamaan</b>, berbeda dengan bahasa Indonesia baku.</li><li><b>越来越 + kata sifat</b> = semakin lama semakin …: 天气越来越冷了. Pola <b>越 A 越 B</b> = semakin A semakin B: 雨越下越大, 越早越好.</li><li><b>一 … 就 …</b> = begitu … langsung …: 我一到家就给你打电话.</li></ul><p class="tip">Setelah 越来越 jangan menambah 很 atau 非常: “越来越很好” salah, yang benar <b>越来越好</b>.</p>',
      pattern: ['虽然 + A, 但是 / 可是 + B', 'Subjek + 越来越 + kata sifat (+ 了)', '越 + A + 越 + B', 'Subjek + 一 + kata kerja 1, 就 + kata kerja 2'],
      examples: ['虽然汉语很难，但是很有意思。|Suīrán Hànyǔ hěn nán, dànshì hěn yǒu yìsi.|Walaupun bahasa Mandarin sulit, tetapi sangat menarik.', '虽然下雨了，可是他还是来了。|Suīrán xià yǔ le, kěshì tā háishi lái le.|Walaupun hujan, dia tetap datang.', '天气越来越冷了。|Tiānqì yuè lái yuè lěng le.|Cuaca semakin dingin.', '你的汉语越来越好了！|Nǐ de Hànyǔ yuè lái yuè hǎo le!|Bahasa Mandarinmu semakin bagus!', '雨越下越大。|Yǔ yuè xià yuè dà.|Hujan makin lama makin deras.', '越早越好。|Yuè zǎo yuè hǎo.|Makin cepat makin baik.', '我一到家就给你打电话。|Wǒ yí dào jiā jiù gěi nǐ dǎ diànhuà.|Begitu sampai rumah saya langsung meneleponmu.', '他一喝酒就脸红。|Tā yì hē jiǔ jiù liǎn hóng.|Begitu minum alkohol, wajahnya langsung merah.'],
      quiz: ['___汉语很难，但是很有意思。|___ Hànyǔ hěn nán, dànshì hěn yǒu yìsi.|虽然:Suīrán|因为:Yīnwèi|所以:Suǒyǐ|Walaupun Mandarin sulit, tetapi menarik.', '虽然下雨了，___他还是来了。|Suīrán xià yǔ le, ___ tā háishi lái le.|可是:kěshì|所以:suǒyǐ|因为:yīnwèi|Walaupun hujan, dia tetap datang.', '天气___冷了。|Tiānqì ___ lěng le.|越来越:yuè lái yuè|一点儿:yìdiǎnr|比:bǐ|Cuaca semakin dingin.', '雨越下___大。|Yǔ yuè xià ___ dà.|越:yuè|就:jiù|很:hěn|Hujan makin lama makin deras.', '我一到家___给你打电话。|Wǒ yí dào jiā ___ gěi nǐ dǎ diànhuà.|就:jiù|才:cái|也:yě|Begitu sampai rumah saya langsung meneleponmu.', '他___喝酒就脸红。|Tā ___ hē jiǔ jiù liǎn hóng.|一:yì|越:yuè|虽然:suīrán|Begitu minum alkohol, wajahnya langsung merah.', '你的汉语越来越___了！|Nǐ de Hànyǔ yuè lái yuè ___ le!|好:hǎo|很好:hěn hǎo|非常好:fēicháng hǎo|Bahasa Mandarinmu semakin bagus!', '越早___好。|Yuè zǎo ___ hǎo.|越:yuè|就:jiù|很:hěn|Makin cepat makin baik.']
    },
    { id: 'm-t3', type: 'topic', cat: 'daily', title: 'Mengundang & Menolak dengan Sopan', zh: '邀请 · yāoqǐng',
      phrases: ['这个周六你有空吗？|Zhège zhōuliù nǐ yǒu kòng ma?|Sabtu ini kamu ada waktu?', '我想请你来我家吃饭。|Wǒ xiǎng qǐng nǐ lái wǒ jiā chī fàn.|Saya ingin mengundangmu makan di rumah saya.', '我请客！|Wǒ qǐngkè!|Saya yang traktir!', '好啊，我一定去。|Hǎo a, wǒ yídìng qù.|Baik, saya pasti datang.', '真不好意思，那天我有事。|Zhēn bù hǎoyìsi, nà tiān wǒ yǒu shì.|Maaf sekali, hari itu saya ada urusan.', '改天吧。|Gǎitiān ba.|Lain hari saja.', '谢谢你的邀请。|Xièxie nǐ de yāoqǐng.|Terima kasih atas undanganmu.', '要我带什么吗？|Yào wǒ dài shénme ma?|Perlu saya bawa sesuatu?', '人来就好，什么都不用带。|Rén lái jiù hǎo, shénme dōu bú yòng dài.|Datang saja sudah cukup, tidak perlu bawa apa-apa.', '我们几点见？在哪儿见？|Wǒmen jǐ diǎn jiàn? Zài nǎr jiàn?|Kita ketemu jam berapa? Di mana?', '我可能会晚到一点儿。|Wǒ kěnéng huì wǎn dào yìdiǎnr.|Saya mungkin akan sedikit terlambat.', '下次我请你。|Xià cì wǒ qǐng nǐ.|Lain kali saya yang traktir.'],
      dialog: ['A|小李，这个周六晚上你有空吗？|Xiǎo Lǐ, zhège zhōuliù wǎnshang nǐ yǒu kòng ma?|Xiao Li, Sabtu malam ini kamu ada waktu?', 'B|有空啊，怎么了？|Yǒu kòng a, zěnme le?|Ada, ada apa?', 'A|我过生日，想请你来我家吃饭。|Wǒ guò shēngrì, xiǎng qǐng nǐ lái wǒ jiā chī fàn.|Saya ulang tahun, ingin mengundangmu makan di rumah.', 'B|生日快乐！我一定去。要我带什么吗？|Shēngrì kuàilè! Wǒ yídìng qù. Yào wǒ dài shénme ma?|Selamat ulang tahun! Saya pasti datang. Perlu bawa sesuatu?', 'A|什么都不用带，人来就好。七点在我家，可以吗？|Shénme dōu bú yòng dài, rén lái jiù hǎo. Qī diǎn zài wǒ jiā, kěyǐ ma?|Tidak perlu bawa apa-apa, datang saja cukup. Jam tujuh di rumah saya, bisa?', 'B|可以。不过我六点半才下班，可能会晚到一点儿。|Kěyǐ. Búguò wǒ liù diǎn bàn cái xiàbān, kěnéng huì wǎn dào yìdiǎnr.|Bisa. Tapi saya baru pulang kerja jam 6.30, mungkin sedikit terlambat.', 'A|没关系，我们等你。|Méi guānxi, wǒmen děng nǐ.|Tidak apa-apa, kami tunggu.', 'B|好的，谢谢你的邀请，周六见！|Hǎo de, xièxie nǐ de yāoqǐng, zhōuliù jiàn!|Baik, terima kasih atas undangannya, sampai jumpa Sabtu!'],
      resp: ['周六你有空吗？|Zhōuliù nǐ yǒu kòng ma?|Sabtu kamu ada waktu?|有空，什么事？:Yǒu kòng, shénme shì?|有，我有三个。:Yǒu, wǒ yǒu sān ge.|不客气。:Bú kèqi.|Ada, ada apa?', '我想请你吃饭。|Wǒ xiǎng qǐng nǐ chī fàn.|Saya ingin mentraktirmu makan.|太好了，谢谢！:Tài hǎo le, xièxie!|没关系。:Méi guānxi.|我是学生。:Wǒ shì xuésheng.|Wah, terima kasih!', '明天一起去看电影吧？|Míngtiān yìqǐ qù kàn diànyǐng ba?|Besok nonton film bareng, yuk?|不好意思，明天我有事，改天吧。:Bù hǎoyìsi, míngtiān wǒ yǒu shì, gǎitiān ba.|不客气，明天见。:Bú kèqi, míngtiān jiàn.|我不认识他。:Wǒ bú rènshi tā.|Maaf, besok saya ada urusan, lain hari saja.', '要我带什么吗？|Yào wǒ dài shénme ma?|Perlu saya bawa sesuatu?|不用，人来就好。:Bú yòng, rén lái jiù hǎo.|带走，谢谢。:Dàizǒu, xièxie.|我带了钥匙。:Wǒ dài le yàoshi.|Tidak usah, datang saja cukup.'] },

    { id: 'h-g1', type: 'grammar', title: 'Bukan Hanya, Sekaligus, Apa Pun', zh: '不但…而且，既…又，无论…都',
      explain: '<p>Tiga pola untuk membuat kalimat lebih kaya, sangat sering dipakai dalam presentasi dan percakapan bisnis:</p><ul><li><b>不但 / 不仅 A，而且 (还 / 也) B</b> = bukan hanya A, tetapi juga B. Menambah poin kedua yang lebih kuat.</li><li><b>既 A 又 B</b> = A sekaligus B. Dua sifat atau peran yang berlaku bersamaan.</li><li><b>无论 / 不管 + kata tanya atau pilihan, … 都 …</b> = apa pun / bagaimanapun …, tetap …. Setelah 无论 harus ada kata tanya (什么, 多, 怎么) atau bentuk pilihan (去不去, A 还是 B).</li></ul><p class="tip">Kalimat seperti 这个方案不但成本低，而且效率高 langsung terdengar profesional dalam rapat.</p>',
      pattern: ['不但 / 不仅 + A，而且 + (还 / 也) + B', '既 + A + 又 + B', '无论 / 不管 + kata tanya / pilihan，Subjek + 都 + …'],
      examples: ['这家餐厅不但便宜，而且好吃。|Zhè jiā cāntīng búdàn piányi, érqiě hǎochī.|Restoran ini bukan hanya murah tetapi juga enak.', '他不仅会说汉语，而且还会说日语。|Tā bùjǐn huì shuō Hànyǔ, érqiě hái huì shuō Rìyǔ.|Dia tidak hanya bisa berbahasa Mandarin, tetapi juga bahasa Jepang.', '这个产品既便宜又好用。|Zhège chǎnpǐn jì piányi yòu hǎoyòng.|Produk ini murah sekaligus mudah dipakai.', '她既是我的同事，又是我的好朋友。|Tā jì shì wǒ de tóngshì, yòu shì wǒ de hǎo péngyou.|Dia rekan kerja sekaligus sahabat saya.', '无论多忙，他都每天运动。|Wúlùn duō máng, tā dōu měitiān yùndòng.|Sesibuk apa pun, dia tetap berolahraga setiap hari.', '不管你去不去，我都要去。|Bùguǎn nǐ qù bu qù, wǒ dōu yào qù.|Kamu pergi atau tidak, saya tetap akan pergi.', '无论遇到什么问题，你都可以找我。|Wúlùn yù dào shénme wèntí, nǐ dōu kěyǐ zhǎo wǒ.|Masalah apa pun yang kamu hadapi, kamu boleh mencari saya.', '这个方案不但成本低，而且效率高。|Zhège fāng\'àn búdàn chéngběn dī, érqiě xiàolǜ gāo.|Rencana ini bukan hanya biayanya rendah, tetapi juga efisien.'],
      quiz: ['这家餐厅___便宜，而且好吃。|Zhè jiā cāntīng ___ piányi, érqiě hǎochī.|不但:búdàn|虽然:suīrán|因为:yīnwèi|Restoran ini bukan hanya murah tetapi juga enak.', '他不仅会说汉语，___还会说日语。|Tā bùjǐn huì shuō Hànyǔ, ___ hái huì shuō Rìyǔ.|而且:érqiě|但是:dànshì|所以:suǒyǐ|Dia tidak hanya bisa Mandarin, tetapi juga Jepang.', '这个产品既便宜___好用。|Zhège chǎnpǐn jì piányi ___ hǎoyòng.|又:yòu|就:jiù|才:cái|Produk ini murah sekaligus mudah dipakai.', '___多忙，他都每天运动。|___ duō máng, tā dōu měitiān yùndòng.|无论:Wúlùn|虽然:Suīrán|因为:Yīnwèi|Sesibuk apa pun, dia tetap berolahraga.', '不管你去不去，我___要去。|Bùguǎn nǐ qù bu qù, wǒ ___ yào qù.|都:dōu|才:cái|而且:érqiě|Kamu pergi atau tidak, saya tetap pergi.', '她___是我的同事，又是我的好朋友。|Tā ___ shì wǒ de tóngshì, yòu shì wǒ de hǎo péngyou.|既:jì|虽然:suīrán|因为:yīnwèi|Dia rekan kerja sekaligus sahabat saya.', '无论遇到什么问题，你___可以找我。|Wúlùn yù dào shénme wèntí, nǐ ___ kěyǐ zhǎo wǒ.|都:dōu|才:cái|又:yòu|Masalah apa pun, kamu boleh mencari saya.', '这个方案不但成本低，___效率高。|Zhège fāng\'àn búdàn chéngběn dī, ___ xiàolǜ gāo.|而且:érqiě|但是:dànshì|因为:yīnwèi|Rencana ini bukan hanya murah, tetapi juga efisien.']
    },
    { id: 'h-t1', type: 'topic', cat: 'work', title: 'Negosiasi Harga dengan Pemasok', zh: '商务谈判 · shāngwù tánpàn',

      dialog: ['A|王总，这批钢材的价格能不能再低一点儿？|Wáng zǒng, zhè pī gāngcái de jiàgé néng bu néng zài dī yìdiǎnr?|Pak Wang, harga baja kiriman ini bisa lebih rendah lagi?', 'B|每吨四千五百元已经是很优惠的价格了。|Měi dūn sìqiān wǔbǎi yuán yǐjīng shì hěn yōuhuì de jiàgé le.|4.500 yuan per ton sudah harga yang sangat bagus.', 'A|可是我们这次订五百吨，比上次多了一倍。|Kěshì wǒmen zhè cì dìng wǔbǎi dūn, bǐ shàng cì duō le yí bèi.|Tetapi kali ini kami pesan 500 ton, dua kali lipat dari sebelumnya.', 'B|如果订五百吨，我们可以给四千三。|Rúguǒ dìng wǔbǎi dūn, wǒmen kěyǐ gěi sìqiān sān.|Kalau pesan 500 ton, kami bisa kasih 4.300.', 'A|四千二吧，我们各让一步。运费包括在里面吗？|Sìqiān èr ba, wǒmen gè ràng yí bù. Yùnfèi bāokuò zài lǐmiàn ma?|4.200 saja, kita sama-sama mengalah. Ongkos kirimnya termasuk?', 'B|好吧，四千二，包括运费到雅加达港口。|Hǎo ba, sìqiān èr, bāokuò yùnfèi dào Yǎjiādá gǎngkǒu.|Baiklah, 4.200, termasuk ongkos kirim sampai pelabuhan Jakarta.', 'A|交货期是多长时间？|Jiāohuò qī shì duō cháng shíjiān?|Waktu pengirimannya berapa lama?', 'B|签合同以后四十五天。合作愉快！|Qiān hétong yǐhòu sìshíwǔ tiān. Hézuò yúkuài!|45 hari setelah tanda tangan kontrak. Senang bekerja sama!'],
      resp: ['能给我们报个价吗？|Néng gěi wǒmen bào ge jià ma?|Bisa berikan penawaran harga?|好的，我今天把报价单发给您。:Hǎo de, wǒ jīntiān bǎ bàojiàdān fā gěi nín.|合作愉快！:Hézuò yúkuài!|我们不需要。:Wǒmen bù xūyào.|Baik, hari ini saya kirimkan daftar harganya.', '这是我们的最低价了。|Zhè shì wǒmen de zuì dī jià le.|Ini sudah harga terendah kami.|那我们需要考虑一下。:Nà wǒmen xūyào kǎolǜ yíxià.|太便宜了，谢谢。:Tài piányi le, xièxie.|我们是最低的。:Wǒmen shì zuì dī de.|Kalau begitu kami perlu mempertimbangkan dulu.', '付款方式是什么？|Fùkuǎn fāngshì shì shénme?|Bagaimana cara pembayarannya?|预付百分之三十，余款发货前付清。:Yùfù bǎi fēn zhī sānshí, yúkuǎn fāhuò qián fùqīng.|四十五天。:Sìshíwǔ tiān.|包括运费。:Bāokuò yùnfèi.|Uang muka 30%, sisanya dilunasi sebelum pengiriman.', '交货期是多长时间？|Jiāohuò qī shì duō cháng shíjiān?|Waktu pengirimannya berapa lama?|签合同以后一个月。:Qiān hétong yǐhòu yí ge yuè.|每吨四千元。:Měi dūn sìqiān yuán.|在雅加达。:Zài Yǎjiādá.|Satu bulan setelah tanda tangan kontrak.'] },

    { id: 'h-g2', type: 'grammar', title: 'Bahkan & Kecuali: 连…都, 除了…以外', zh: '连…都，除了…以外',
      explain: '<p><b>连 A 都 / 也 …</b> = bahkan A pun …. Dipakai untuk menekankan sesuatu yang ekstrem atau tak terduga.</p><ul><li>他忙得<b>连</b>饭<b>都</b>没吃。 Dia sibuk sampai makan pun belum.</li><li>我<b>连</b>一个字<b>也</b>看不懂。 Satu karakter pun saya tidak paham.</li></ul><p><b>除了 A (以外)</b> punya dua makna, tergantung kata setelahnya:</p><ul><li>+ <b>都</b> = <b>kecuali</b> A: 除了小王以外，大家都来了 (kecuali Xiao Wang, semua datang).</li><li>+ <b>还 / 也</b> = <b>selain</b> A, juga: 除了汉语，我还学英语 (selain Mandarin, saya juga belajar Inggris).</li></ul><p class="tip">Kunci membedakan: lihat kata <b>都</b> (kecuali) atau <b>还 / 也</b> (selain) di bagian kedua kalimat.</p>',
      pattern: ['连 + A + 都 / 也 + …', '除了 + A + (以外)，… + 都 + … (kecuali)', '除了 + A + (以外)，… + 还 / 也 + … (selain)'],
      examples: ['他忙得连饭都没吃。|Tā máng de lián fàn dōu méi chī.|Dia sibuk sampai makan pun belum.', '这个问题连孩子都知道。|Zhège wèntí lián háizi dōu zhīdào.|Soal ini bahkan anak kecil pun tahu.', '我连一个字也看不懂。|Wǒ lián yí ge zì yě kàn bu dǒng.|Satu karakter pun saya tidak paham.', '除了小王以外，大家都来了。|Chúle Xiǎo Wáng yǐwài, dàjiā dōu lái le.|Kecuali Xiao Wang, semua sudah datang.', '除了汉语，我还学英语。|Chúle Hànyǔ, wǒ hái xué Yīngyǔ.|Selain bahasa Mandarin, saya juga belajar bahasa Inggris.', '除了星期天，他每天都上班。|Chúle xīngqītiān, tā měitiān dōu shàngbān.|Kecuali hari Minggu, dia bekerja setiap hari.', '这件事连经理也不知道。|Zhè jiàn shì lián jīnglǐ yě bù zhīdào.|Hal ini bahkan manajer pun tidak tahu.', '除了价格以外，我们也要考虑质量。|Chúle jiàgé yǐwài, wǒmen yě yào kǎolǜ zhìliàng.|Selain harga, kita juga harus mempertimbangkan kualitas.'],
      quiz: ['他忙得___饭都没吃。|Tā máng de ___ fàn dōu méi chī.|连:lián|除了:chúle|把:bǎ|Dia sibuk sampai makan pun belum.', '这个问题连孩子___知道。|Zhège wèntí lián háizi ___ zhīdào.|都:dōu|还:hái|就:jiù|Soal ini bahkan anak kecil pun tahu.', '___小王以外，大家都来了。|___ Xiǎo Wáng yǐwài, dàjiā dōu lái le.|除了:Chúle|连:Lián|虽然:Suīrán|Kecuali Xiao Wang, semua sudah datang.', '除了汉语，我___学英语。|Chúle Hànyǔ, wǒ ___ xué Yīngyǔ.|还:hái|连:lián|才:cái|Selain bahasa Mandarin, saya juga belajar Inggris.', '除了星期天，他每天___上班。|Chúle xīngqītiān, tā měitiān ___ shàngbān.|都:dōu|还:hái|连:lián|Kecuali hari Minggu, dia bekerja setiap hari.', '我连一个字___看不懂。|Wǒ lián yí ge zì ___ kàn bu dǒng.|也:yě|还:hái|就:jiù|Satu karakter pun saya tidak paham.', '除了价格___，我们也要考虑质量。|Chúle jiàgé ___, wǒmen yě yào kǎolǜ zhìliàng.|以外:yǐwài|以后:yǐhòu|以前:yǐqián|Selain harga, kita juga harus mempertimbangkan kualitas.', '这件事连经理___不知道。|Zhè jiàn shì lián jīnglǐ ___ bù zhīdào.|也:yě|还:hái|才:cái|Hal ini bahkan manajer pun tidak tahu.']
    },

      dialog: ['A|新年快乐！恭喜发财！|Xīnnián kuàilè! Gōngxǐ fācái!|Selamat Tahun Baru! Semoga makmur!', 'B|新年快乐！欢迎欢迎，快请进！|Xīnnián kuàilè! Huānyíng huānyíng, kuài qǐng jìn!|Selamat Tahun Baru! Selamat datang, ayo masuk!', 'A|这是一点儿印尼的咖啡，送给您。|Zhè shì yìdiǎnr Yìnní de kāfēi, sòng gěi nín.|Ini sedikit kopi Indonesia untuk Anda.', 'B|您太客气了！随便坐。来，尝尝我包的饺子。|Nín tài kèqi le! Suíbiàn zuò. Lái, chángchang wǒ bāo de jiǎozi.|Anda terlalu repot! Silakan duduk. Ayo cicipi pangsit buatan saya.', 'A|真好吃！是什么馅儿的？|Zhēn hǎochī! Shì shénme xiànr de?|Enak sekali! Isinya apa?', 'B|这是白菜鸡肉的，我知道你不吃猪肉。|Zhè shì báicài jīròu de, wǒ zhīdào nǐ bù chī zhūròu.|Ini isi sawi dan ayam, saya tahu kamu tidak makan babi.', 'A|谢谢您这么细心。我以茶代酒，祝您全家身体健康！|Xièxie nín zhème xìxīn. Wǒ yǐ chá dài jiǔ, zhù nín quán jiā shēntǐ jiànkāng!|Terima kasih atas perhatian Anda. Saya bersulang dengan teh, semoga seluruh keluarga Anda sehat!', 'B|谢谢！干杯！|Xièxie! Gānbēi!|Terima kasih! Bersulang!'],
      resp: ['恭喜发财！|Gōngxǐ fācái!|Semoga makmur!|恭喜恭喜，新年快乐！:Gōngxǐ gōngxǐ, xīnnián kuàilè!|不客气。:Bú kèqi.|对不起。:Duìbuqǐ.|Selamat, Selamat Tahun Baru!', '这是送给您的礼物。|Zhè shì sòng gěi nín de lǐwù.|Ini hadiah untuk Anda.|您太客气了，谢谢！:Nín tài kèqi le, xièxie!|没关系。:Méi guānxi.|我吃饱了。:Wǒ chī bǎo le.|Anda terlalu repot, terima kasih!', '再吃一点儿吧！|Zài chī yìdiǎnr ba!|Makan lagi sedikit!|谢谢，我已经吃饱了。:Xièxie, wǒ yǐjīng chī bǎo le.|干杯！:Gānbēi!|恭喜发财！:Gōngxǐ fācái!|Terima kasih, saya sudah kenyang.', '时间不早了，我该走了。|Shíjiān bù zǎo le, wǒ gāi zǒu le.|Sudah larut, saya harus pamit.|好，路上小心，有空再来！:Hǎo, lùshang xiǎoxīn, yǒu kòng zài lái!|请进！:Qǐng jìn!|欢迎光临！:Huānyíng guānglín!|Baik, hati-hati di jalan, mampir lagi ya!'] },
